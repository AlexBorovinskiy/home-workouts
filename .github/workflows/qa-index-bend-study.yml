name: Inspect alternative index-bend strengths against photo two
on:
  push:
    paths:
      - '.github/workflows/qa-index-bend-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/index-bend --no-audit --no-fund playwright-core@1.56.1
      - name: Measure and render original MRI index curl at anatomical thumb opposition
        shell: bash
        run: |
          mkdir -p study
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          node --input-type=module <<'NODE'
          import {chromium} from '/tmp/index-bend/node_modules/playwright-core/index.mjs';
          import {writeFileSync} from 'node:fs';
          const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:1,isMobile:true,hasTouch:true,serviceWorkers:'block'});
          try{
            await page.goto('http://127.0.0.1:8765/anatomy-first/thumb-lab-reference.html',{waitUntil:'domcontentloaded',timeout:50000});
            await page.waitForFunction(()=>window.__thumbQA?.ready(),null,{timeout:70000});
            await page.evaluate(()=>window.__thumbQA.pose('oppose'));
            const rows=[];
            for(const flex of [30,35,40,45,50,55,60,65,70,72,75,80,85,90,95,100]){
              const data=await page.evaluate(x=>{window.__thumbQA.setIndexCurl(x/100);return window.__thumbQA.metrics()},flex);
              rows.push({curl: flex, gap: Number(data.boneTipDistanceMm),indexTip:data.indexTip,thumbTip:data.thumbTip});
              if([40,50,55,65,72,85].includes(flex)){
                for(const view of ['palm','side']){
                  await page.evaluate(v=>window.__thumbQA.view(v),view);
                  await page.waitForTimeout(135);
                  await page.locator('canvas').screenshot({path:'study/flex-'+flex+'-'+view+'.png'});
                }
              }
            }
            rows.sort((a,b)=>a.gap-b.gap);
            writeFileSync('study/ranking.json',JSON.stringify(rows,null,2));
            console.log(JSON.stringify(rows.slice(0,10)));
          }catch(e){writeFileSync('study/error.txt',String(e));throw e}
          finally{await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-bend-photo-reference-review
          path: study/
          retention-days: 3
