name: Publish verified native pelvis experiment
on:
  push:
    paths:
      - '.github/workflows/publish-pelvis-experiment.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore completed native computation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p result
          gh run download 45377866490 -n native-pelvis-block-qa -D result
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('result/pelvis-block.json')
          q=json.loads(p.read_text())
          assert q['nativeReplayQA']['frames']==186 and q['nativeReplayQA']['allOriginalMotionsPreserved']
          assert q['nativeReplayQA']['maxPositionResidualM']<1e-5
          assert not q['anatomicallyValidated']
          PY
          cp result/pelvis-block.json unified-rig/pelvis-block.json
          cp result/sequences.json unified-rig/sequences-pelvis.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/pelvis-publish --no-audit --no-fund playwright-core@1.56.1
      - name: Download verified local FHS anatomy for visual QA
        run: |
          for url in 'https://zenodo.org/api/records/18259702/files/FHS_dataset_4.x.zip/content' 'https://zenodo.org/records/18259702/files/FHS_dataset_4.x.zip?download=1'; do
            if curl -fL --retry 1 --retry-all-errors --max-time 160 "$url" -o /tmp/fhs.zip && echo 'd2db8c587afb5d1ee0c8081f84c43f8e  /tmp/fhs.zip' | md5sum -c -; then break; fi
            rm -f /tmp/fhs.zip
          done
          test -s /tmp/fhs.zip
      - name: Verify and capture mobile anatomy comparison
        run: |
          mkdir -p qa-pelvis-publish
          python3 -m http.server 8782 --bind 127.0.0.1 >/tmp/pelvis-http.log 2>&1 &
          node --input-type=module <<'NODE'
          import {chromium} from '/tmp/pelvis-publish/node_modules/playwright-core/index.mjs';
          import {writeFileSync} from 'node:fs';
          const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:430,height:932},isMobile:true,hasTouch:true,deviceScaleFactor:1});
          const errors=[];page.on('pageerror',e=>errors.push(e.message));
          try{
            await page.goto('http://127.0.0.1:8782/unified-rig/pelvis.html',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForFunction(()=>window.__unifiedSurfaceQA?.version==='pelvis',null,{timeout:120000});
            await page.locator('#zip').setInputFiles('/tmp/fhs.zip');
            await page.waitForFunction(()=>{let s=window.__unifiedSurfaceQA?.stats.FHS;return s&&s.ok===s.total&&s.total===45},null,{timeout:150000});
            const audit=()=>page.evaluate(()=>{let q=window.__unifiedSurfaceQA;return {version:q.version,stats:q.stats,errors:q.errors,visibleNative:q.meshes.filter(m=>m.visible&&m.userData.group==='NativePelvis').map(m=>m.userData.file),visibleOld:q.meshes.filter(m=>m.visible&&m.userData.group==='FHS'&&/^(sacrum|pelvis)$/.test(m.userData.body)).map(m=>m.userData.file),frames:q.data.sequences.reduce((a,s)=>a+s.frames.length,0)}});
            await page.locator('#region').selectOption('pelvic');
            await page.locator('#links').uncheck();
            const reports={};
            for(const v of ['calibrated','pelvis']){
              await page.locator('#version').selectOption(v);await page.waitForFunction(x=>window.__unifiedSurfaceQA.version===x,v);
              await page.locator('#sequence').selectOption('pronation');
              await page.locator('#phase').evaluate(e=>{e.value=0;e.dispatchEvent(new Event('input'))});
              let q=await audit();if(q.errors.length||q.frames!==186||(v==='pelvis'&&(q.visibleNative.length!==3||q.visibleOld.length!==0))||(v==='calibrated'&&(q.visibleNative.length!==0||q.visibleOld.length!==3)))throw Error(JSON.stringify(q));reports[v]=q;
              for(const camera of ['front','side','back']){
                await page.locator('[data-view="'+camera+'"]').click();await page.waitForTimeout(450);await page.locator('#stage').screenshot({path:'qa-pelvis-publish/'+v+'-'+camera+'.png'});
              }
              await page.locator('#sequence').selectOption('legs');
              await page.locator('#phase').evaluate(e=>{e.value=e.max;e.dispatchEvent(new Event('input'))});
              await page.locator('[data-view="side"]').click();await page.waitForTimeout(450);await page.locator('#stage').screenshot({path:'qa-pelvis-publish/'+v+'-flexion.png'});
            }
            if(errors.length)throw Error(errors.join('; '));
            writeFileSync('qa-pelvis-publish/report.json',JSON.stringify({reports,passed:true},null,2));
            console.log('PELVIS_COMPARISON_QA_SUCCESS');
          }catch(e){writeFileSync('qa-pelvis-publish/failure.txt',String(e)+'\n'+errors.join('\n'));await page.screenshot({path:'qa-pelvis-publish/failure.png'}).catch(()=>{});throw e}
          finally{await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pelvis-experiment-comparison
          path: qa-pelvis-publish/
          retention-days: 7
      - name: Publish tested experimental data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unified-rig/pelvis-block.json unified-rig/sequences-pelvis.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish tested experimental native pelvis block'
            for n in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
