name: Inspect MASI scientific replacement model
on:
  push:
    paths:
      - 'opensim-lab/inspect_masi_source.py'
      - 'opensim-lab/verify_masi_opensim.py'
      - 'opensim-lab/convert_masi_legacy.py'
      - '.github/workflows/qa-masi-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MASI_DOWNLOAD_LIMIT_MB: '200'
      MASI_REPORT_PATH: 'qa-masi-source/masi-inventory.json'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve publisher dataset metadata and inspect archives
        run: python opensim-lab/inspect_masi_source.py
      - name: Install native OpenSim 4.6
        run: python -m pip install 'opensim==4.6'
      - name: Fetch the exact published MASI .osim and examine in native engine
        run: |
          curl -fL --retry 3 --max-time 100 'https://ndownloader.figshare.com/files/6929198' -o /tmp/masi-v2-authors.osim
          test -s /tmp/masi-v2-authors.osim
          python opensim-lab/verify_masi_opensim.py --model /tmp/masi-v2-authors.osim --output qa-masi-source/masi-native-audit.json
      - name: Test name-only OpenSim 3.2 migration with all source biomechanical parameters unchanged
        run: |
          python opensim-lab/convert_masi_legacy.py --source /tmp/masi-v2-authors.osim --output /tmp/masi-name-migrated.osim
          python opensim-lab/verify_masi_opensim.py --model /tmp/masi-name-migrated.osim --output qa-masi-source/masi-migrated-native-audit.json
      - name: Verify source and provenance
        run: |
          python - <<'PY'
          import json
          j=json.load(open('qa-masi-source/masi-inventory.json'))
          assert j['articleId']==4249808 and j['version']==2
          assert len(j['files'])>0
          print('MASI_METADATA_QA',json.dumps({
             'doi':j['doi'],'fileNames':[x['name'] for x in j['files']],
             'fileSizesMb':[round(x['size']/1048576,2) for x in j['files']],
             'archiveStatuses':[(x['file'],x['inspection']['status']) for x in j['archives']],
             'nativeOpenSimLoaded':j['nativeOpenSimLoaded'],
             'FHSmodelModified':j['FHSmodelModified']
          }))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masi-publisher-metadata-only
          path: qa-masi-source/
          retention-days: 7
