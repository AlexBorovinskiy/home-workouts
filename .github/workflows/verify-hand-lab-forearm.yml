name: QA forearm and thumb preview (isolated)
on:
  push:
    paths:
      - '.github/workflows/verify-hand-lab-forearm.yml'
      - 'anatomy-rigged/hand-lab-forearm-preview.html'
      - 'anatomy-rigged/forearm-extension.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hand-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser adapter
        run: npm install --prefix /tmp/handlab-qa --no-fund --no-audit playwright-core@1.56.1
      - name: Render three poses on iPhone-sized viewport
        shell: bash
        run: |
          mkdir -p screenshots
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/handlab.log 2>&1 &
          node --input-type=module <<'NODE'
          import {chromium} from '/tmp/handlab-qa/node_modules/playwright-core/index.mjs';
          import {writeFileSync} from 'node:fs';
          const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const context=await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:1,isMobile:true,hasTouch:true,serviceWorkers:'block'});
          const page=await context.newPage(),errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
          try{
            await page.goto('http://127.0.0.1:8765/anatomy-rigged/hand-lab-forearm-preview.html',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.__handLabQA?.isReady()||document.querySelector('#error')?.classList.contains('on'),null,{timeout:90000});
            if(!await page.evaluate(()=>window.__handLabQA?.isReady()))throw Error('Hand lab did not initialize: '+await page.locator('#error').innerText());
            await page.locator('#viewer').scrollIntoViewIfNeeded();
            const poses=['start','middle','peak'];
            for(let i=0;i<3;i++){
              await page.locator('[data-pose="'+i+'"]').click();
              await page.waitForTimeout(500);
              await page.locator('canvas').screenshot({path:'screenshots/'+poses[i]+'-front.png'});
              await page.locator('[data-view="side"]').click();
              await page.waitForTimeout(400);
              await page.locator('canvas').screenshot({path:'screenshots/'+poses[i]+'-side.png'});
            }
            await page.locator('[data-pose="0"]').click();
            await page.locator('[data-view="thumb"]').click();
            await page.waitForTimeout(400);
            await page.locator('canvas').screenshot({path:'screenshots/start-thumb.png'});
            await page.locator('[data-view="back"]').click();
            await page.waitForTimeout(400);
            await page.locator('canvas').screenshot({path:'screenshots/start-back.png'});
            const contact=await page.evaluate(()=>window.__handLabQA.check());
            const wrist=await page.evaluate(()=>window.__handLabQA.getForearm());
            if(!wrist||wrist.vertices<35)throw Error('Forearm must sample real wrist vertices');
            const digits=['index','middle','ring','pinky','thumb'];
            if(!contact.digits||digits.some(d=>!contact.digits[d]||contact.digits[d].samples<=0))throw Error('No separate digit diagnostics');
            if(await page.locator('#digitResults tbody tr').count()!==5)throw Error('Expected five diagnostic table rows');
            await page.locator('#thumbTuning summary').click();
            await page.locator('[data-thumb="baseX"]').fill('-35');
            await page.locator('[data-thumb="baseX"]').dispatchEvent('change');
            const changed=await page.locator('[data-value="baseX"]').innerText();
            if(changed!=='-35°')throw Error('Thumb control was not applied: '+changed);
            await page.locator('#thumbReset').click();
            const reset=await page.locator('[data-value="baseX"]').innerText();
            if(reset!=='-22°')throw Error('Thumb reset did not restore default: '+reset);
            await page.screenshot({path:'screenshots/mobile-page.png',fullPage:true});
            const report={contact,wrist,hud:await page.locator('#hud').innerText(),thumbChange:changed,thumbReset:reset,errors};
            writeFileSync('screenshots/qa-report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            if(errors.length||!Number.isFinite(contact.minimumDistance)||contact.samples<100)throw Error('QA returned invalid scene or runtime errors');
          }catch(e){
            await page.screenshot({path:'screenshots/failure.png',fullPage:true}).catch(()=>{});
            writeFileSync('screenshots/failure.txt',String(e)+'\n'+errors.join('\n'));
            throw e;
          }finally{await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hand-lab-forearm-mobile-qa
          path: screenshots/
          retention-days: 5