name: QA published authentic MRI-derived hand skeleton
on:
  push:
    paths:
      - '.github/workflows/qa-real-hand-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/real-hand-live-qa --no-audit --no-fund playwright-core@1.56.1
      - name: Inspect deployed site in mobile Chrome
        shell: bash
        run: |
          mkdir -p proof
          node --input-type=module <<'NODE'
          import {chromium} from '/tmp/real-hand-live-qa/node_modules/playwright-core/index.mjs';
          import {writeFileSync} from 'node:fs';
          const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:1,isMobile:true,hasTouch:true,serviceWorkers:'block'});
          const errors=[];page.on('pageerror',e=>errors.push('JS: '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
          try{
            const url='https://alexborovinskiy.github.io/home-workouts/anatomy-first/real-bones-preview.html?camera=anatomical-v3';
            const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:65000});
            if(r.status()!==200)throw Error('Preview not published: HTTP '+r.status());
            await page.waitForFunction(()=>window.__realBonesQA?.ready()||document.querySelector('#error')?.classList.contains('on'),null,{timeout:70000});
            if(!await page.evaluate(()=>window.__realBonesQA?.ready()))throw Error('GLB failed: '+await page.locator('#error').innerText());
            const count=await page.evaluate(()=>window.__realBonesQA.count());
            if(count!==34)throw Error('Expected 34 original large+small mesh groups; got '+count);
            const checkboxes=await page.locator('#segments input[type=checkbox]').count();
            if(checkboxes!==count)throw Error('Missing individual bone toggles');
            const bounds=await page.evaluate(()=>window.__realBonesQA.bounds());
            if(bounds.some(v=>!Number.isFinite(v)||v<=0))throw Error('Invalid model bounds '+bounds);
            await page.evaluate(()=>window.__realBonesQA.view('front'));
            await page.waitForTimeout(300);
            await page.locator('canvas').screenshot({path:'proof/real-bones-assembled.png'});
            await page.locator('#explode').click();
            await page.waitForTimeout(250);
            await page.locator('canvas').screenshot({path:'proof/real-bones-separated.png'});
            await page.locator('#reset').click();
            await page.locator('[data-view="side"]').click();
            await page.waitForTimeout(200);
            await page.locator('canvas').screenshot({path:'proof/real-bones-side.png'});
            await page.locator('#segments input[type=checkbox]').first().uncheck();
            if(await page.locator('#segments input[type=checkbox]').first().isChecked())throw Error('Visibility toggle failed');
            const report={url,meshCount:count,bounds,checkboxes,errors};
            writeFileSync('proof/report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            if(errors.length)throw Error('Browser runtime errors: '+errors.join(' | '));
          }catch(e){writeFileSync('proof/error.txt',String(e)+'\n'+errors.join('\n'));await page.screenshot({path:'proof/error.png',fullPage:true}).catch(()=>{});throw e}
          finally{await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-hand-deployed-mobile-qa
          path: proof/
          retention-days: 3
