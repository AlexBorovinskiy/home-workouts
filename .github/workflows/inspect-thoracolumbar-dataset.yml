name: Inspect research thoracolumbar OpenSim models
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-thoracolumbar-dataset.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public research archive, analyze .osim without publishing model files
        shell: bash
        run: |
          mkdir -p qa-spine
          curl -fL --max-time 150 --retry 2 \
            'https://zenodo.org/records/18259702/files/FHS_dataset_4.x.zip?download=1' \
            -o /tmp/opensim-fhs.zip
          python3 - <<'PY'
          import zipfile, xml.etree.ElementTree as ET, json, re, hashlib, os
          p='/tmp/opensim-fhs.zip'
          print('ARCHIVE_BYTES',os.path.getsize(p))
          out={'provenance':'https://zenodo.org/records/18259702','archive_sha256':hashlib.sha256(open(p,'rb').read()).hexdigest(),'models':[]}
          with zipfile.ZipFile(p) as z:
            names=[n for n in z.namelist() if n.lower().endswith('.osim')]
            with open('/tmp/fhs-sample.osim','wb') as sample:
              sample.write(z.read(names[0]))
            print('OSIM_FILES',len(names),'SAMPLE_NAMES',json.dumps(names[:12]))
            from collections import Counter
            suffixes=Counter(os.path.splitext(n.lower())[1] for n in z.namelist() if not n.endswith('/'))
            print('ZIP_FILE_EXTENSIONS',json.dumps(suffixes.most_common(35)))
            print('ZIP_MESH_FILE_SAMPLE',json.dumps([n for n in z.namelist() if n.lower().endswith(('.vtp','.obj','.stl','.ply','.glb','.fbx'))][:40]))
            first=ET.fromstring(z.read(names[0])).find('Model')
            geometryRefs=[n.text for n in first.findall('.//mesh_file') if n.text]
            print('FIRST_OSIM_MESH_REFERENCES',json.dumps(Counter(geometryRefs).most_common(30)))
            for target in ('skull.vtp','thumbprox.vtp','cerv1.vtp'):
              path0=next((n for n in z.namelist() if n.endswith('/Geometry/'+target)),None)
              if path0:
                data=z.read(path0)
                print('MESH_SAMPLE',target,'BYTES',len(data),'HEAD',repr(data[:800]))
            for b in first.findall('./BodySet/objects/Body'):
              if b.get('name') in ('head_neck','hand_R'):
                print('BODY_ATTACHED_SAMPLE',b.get('name'),ET.tostring(b.find('attached_geometry'),encoding='unicode')[:3300])
            print('FIRST_OSIM_HEAD_BODY',json.dumps([
               {'name':b.get('name'), 'attached':len(b.findall('./attached_geometry/*')),
                'meshrefs':[m.text for m in b.findall('.//mesh_file')]}
               for b in first.findall('./BodySet/objects/Body')
               if 'head' in (b.get('name') or '').lower() or 'hand' in (b.get('name') or '').lower()
            ]))
            for name in names[:8]:
              root=ET.fromstring(z.read(name))
              model=root.find('Model')
              if model is None:continue
              bodies=model.findall('./BodySet/objects/Body')
              joints=[j for j in model.findall('./JointSet/objects/*') if j.tag.endswith('Joint')]
              muscles=[m for m in model.findall('./ForceSet/objects/*') if m.tag.endswith('Muscle')]
              coords=sum(len(j.findall('.//Coordinate')) for j in joints)
              if len(out['models'])==0:
                print('FIRST_MODEL_BODIES',json.dumps([b.attrib.get('name','') for b in bodies]))
                print('FIRST_MODEL_JOINTS',json.dumps([j.attrib.get('name','') for j in joints]))
                print('FIRST_MODEL_COORDINATES',json.dumps([c.attrib.get('name','') for j in joints for c in j.findall('.//Coordinate')][:70]))
              labels=[]
              for b in bodies:
                bn=b.attrib.get('name','')
                found=re.search(r'(?<![a-zA-Z0-9])(T(?:1[0-2]|[1-9])|L[1-5])(?![a-zA-Z0-9])',bn,re.I)
                if found:labels.append(found.group(1).upper())
              out['models'].append({'filename':name,'model_name':model.get('name'), 'bodies':len(bodies),
               'joints':len(joints),'muscles':len(muscles),'coordinates':coords,'levels':sorted(set(labels))})
          with open('qa-spine/research-inventory.json','w') as f:json.dump(out,f,ensure_ascii=False,indent=2)
          print('RESEARCH_SPINE_INVENTORY',json.dumps(out,ensure_ascii=False))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA
        run: npm install --prefix /tmp/open-fhs-qa --no-audit --no-fund playwright-core@1.56.1
      - name: Import 2026 scientific .osim in actual mobile browser
        shell: bash
        run: |
          python3 -m http.server 8789 --bind 127.0.0.1 >/tmp/open-fhs-server.log 2>&1 &
          node --input-type=module <<'NODE'
          import {chromium} from '/tmp/open-fhs-qa/node_modules/playwright-core/index.mjs';
          const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--use-angle=swiftshader']});
          try {
            const page=await browser.newPage({viewport:{width:430,height:932},isMobile:true,hasTouch:true});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8789/opensim-lab/',{waitUntil:'domcontentloaded'});
            await page.locator('#file').setInputFiles('/tmp/fhs-sample.osim');
            await page.waitForFunction(()=>window.__osimQA?.get()!=null,null,{timeout:30000});
            const data=await page.evaluate(()=>window.__osimQA.get());
            console.log('SCIENTIFIC_IMPORT_QA '+JSON.stringify({
              bodies:data.bodies,joints:data.joints,coords:data.coordinates,
              muscles:data.muscles,vertebrae:data.present,intervertebral:data.intervertebral,
              browserErrors:errors
            }));
            if(data.present.length!==17||data.intervertebral<16||data.muscles<500||errors.length)
              throw Error('Scientific OpenSim model did not pass parser QA');
            await page.screenshot({path:'qa-spine/scientific-import-mobile.png',fullPage:true});
          } finally {await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thoracolumbar-research-inventory
          path: qa-spine/
          retention-days: 5
