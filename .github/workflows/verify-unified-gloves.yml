name: Visual QA unified glove experiment
on:
  push:
    paths:
      - '.github/workflows/verify-unified-gloves.yml'
      - 'anatomy-rigged/unified-hands.js'
      - 'anatomy-rigged/lesson-unified-preview.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser controller
        run: npm install --prefix /tmp/unified-qa --no-audit --no-fund playwright-core@1.56.1
      - name: Check mobile rendering of unified-rig gloves
        shell: bash
        run: |
          mkdir -p screenshots
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/unified-http.log 2>&1 &
          node --input-type=module <<'NODE'
          import {chromium} from '/tmp/unified-qa/node_modules/playwright-core/index.mjs';
          import {writeFileSync} from 'node:fs';
          const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const context=await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:1,isMobile:true,hasTouch:true,serviceWorkers:'block'});
          const page=await context.newPage(),errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',msg=>{if(msg.type()==='error')errors.push('console: '+msg.text())});
          try{
            await page.goto('http://127.0.0.1:8765/anatomy-rigged/lesson-unified-preview.html',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>Boolean(window.__skinPreviewDebug)||document.querySelector('#error')?.classList.contains('show'),null,{timeout:90000});
            const state=await page.evaluate(()=>window.__skinPreviewDebug?.getState()||null);
            if(!state?.enabled)throw Error('Unified glove preview failed: '+await page.locator('#errorText').innerText());
            await page.evaluate(()=>window.__skinPreviewDebug.setCamera({zoom:.85,panX:.25,panY:-.10,yaw:0,pitch:0}));
            await page.waitForTimeout(700);
            await page.locator('canvas').screenshot({path:'screenshots/start-front.png'});
            await page.evaluate(()=>window.__skinPreviewDebug.setCamera({zoom:.85,panX:-.25,panY:-.10,yaw:0,pitch:0}));
            await page.waitForTimeout(300);
            await page.locator('canvas').screenshot({path:'screenshots/start-other-hand.png'});
            await page.evaluate(()=>window.__skinPreviewDebug.setCamera({zoom:.85,panX:.25,panY:.32,yaw:0,pitch:0}));
            await page.locator('#timeline').evaluate(el=>{el.value='500';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.waitForTimeout(600);
            await page.locator('canvas').screenshot({path:'screenshots/peak-front.png'});
            await page.locator('[data-view="side"]').click();
            await page.waitForTimeout(600);
            await page.locator('canvas').screenshot({path:'screenshots/peak-side.png'});
            await page.screenshot({path:'screenshots/page.png',fullPage:true});
            const result={state,status:await page.locator('#gripStatus').innerText(),errors};
            writeFileSync('screenshots/qa.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
            if(errors.length)throw Error('Rendering console errors detected');
          }catch(e){
            await page.screenshot({path:'screenshots/error.png',fullPage:true}).catch(()=>{});
            writeFileSync('screenshots/failure.txt',String(e)+'\n'+errors.join('\n'));
            throw e;
          }finally{await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-gloves-preview
          path: screenshots/
          retention-days: 2
