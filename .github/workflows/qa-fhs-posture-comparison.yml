name: QA FHS 110 vs 989 real vertebra geometry posture comparison
on:
  push:
    paths:
      - 'opensim-lab/posture-comparison.html'
      - 'opensim-lab/assets/fhs-peer-989-frames.json'
      - 'opensim-lab/assets/fhs-posture-peer-comparison.json'
      - '.github/workflows/qa-fhs-posture-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile Chrome QA framework
        run: npm install --prefix /tmp/qa-fhs-posture --no-audit --no-fund playwright-core@1.56.1
      - name: Download original author FHS ZIP
        run: |
          curl -fL --retry 3 --max-time 180 \
            'https://zenodo.org/records/18259702/files/FHS_dataset_4.x.zip?download=1' \
            -o /tmp/FHS_4x_source.zip
      - name: Verify both FHS bone meshes on mobile, no shape modification
        run: |
          mkdir -p qa-fhs-posture-mobile
          python3 -m http.server 8791 --bind 127.0.0.1 >/tmp/qa-fhs-posture-http.log 2>&1 &
          node --input-type=module <<'NODE'
          import {chromium} from '/tmp/qa-fhs-posture/node_modules/playwright-core/index.mjs';
          import {writeFileSync} from 'node:fs';
          const browser=await chromium.launch({channel:'chrome',headless:true,
            args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          const errors=[];page.on('pageerror',e=>errors.push(e.message));
          const read=()=>page.evaluate(()=>{
            const q=window.__fhsPostureComparisonQA;
            return {ready:q.ready(),counts:q.counts(),layout:q.layout(),view:q.view(),
              p:q.currentPercentile(),box:q.bbox(),framing:q.framing()};
          });
          try{
            await page.goto('http://127.0.0.1:8791/opensim-lab/posture-comparison.html',{waitUntil:'domcontentloaded'});
            await page.locator('#file').setInputFiles('/tmp/FHS_4x_source.zip');
            await page.waitForFunction(()=>window.__fhsPostureComparisonQA?.ready()||
              document.querySelector('#statusText')?.textContent?.includes('Ошибка архива'),null,{timeout:130000});
            const a=await read();
            if(!a.ready||a.counts["110"]!==20||a.counts["989"]!==20||
               a.layout!=='side'||a.view!=='profile'||a.p!==6)
              throw Error('Source pose comparison failed '+JSON.stringify(a));
            if(a.box.max.some(x=>!Number.isFinite(x))||a.box.min.some(x=>!Number.isFinite(x)))
              throw Error('Missing bone dimensions');
            if(a.framing.maxAbsX>.93||a.framing.maxAbsY>.93)
              throw Error('Side-by-side spines clipped outside mobile canvas '+JSON.stringify(a.framing));
            await page.locator('#scene').screenshot({path:'qa-fhs-posture-mobile/FHS-110-and-989-source-spines-side-by-side.png'});
            await page.locator('[data-layout="overlay"]').click();
            if((await read()).layout!=='overlay')throw Error('Overlay failed');
            await page.locator('#scene').screenshot({path:'qa-fhs-posture-mobile/FHS-spines-source-overlay.png'});
            await page.locator('#showPelvis').uncheck();
            await page.locator('#scene').screenshot({path:'qa-fhs-posture-mobile/FHS-vertebrae-only-overlay.png'});
            await page.locator('#showPelvis').check();
            await page.locator('[data-layout="side"]').click();
            await page.locator('[data-view="front"]').click();
            if((await read()).view!=='front')throw Error('Front view failed');
            await page.locator('#scene').screenshot({path:'qa-fhs-posture-mobile/FHS-110-and-989-front.png'});
            if(errors.length)throw Error('JavaScript errors '+JSON.stringify(errors));
            writeFileSync('qa-fhs-posture-mobile/report.json',JSON.stringify({first:a,errors},null,2));
            console.log('FHS_POSTURE_SOURCE_COMPARISON_MOBILE_QA_SUCCESS',
              JSON.stringify({source:2,verts:a.counts,percentile:a.p}));
          }catch(e){
            console.error(e);
            await page.screenshot({path:'qa-fhs-posture-mobile/failed.png',fullPage:true}).catch(()=>{});
            throw e;
          }finally{await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FHS-native-source-spine-posture-comparison-mobile
          path: qa-fhs-posture-mobile/
          retention-days: 14
