name: QA scientific C7-T1 neck to spine registration
on:
  push:
    paths:
      - 'opensim-lab/audit_c7_t1_registration.py'
      - '.github/workflows/qa-c7-t1-registration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native OpenSim 4.6
        run: python -m pip install 'opensim==4.6'
      - name: Download original verified research sources
        shell: bash
        run: |
          curl -fL --retry 3 --max-time 160 'https://zenodo.org/records/18259702/files/FHS_dataset_4.x.zip?download=1' -o /tmp/fhs-original.zip
          curl -fL --retry 3 --max-time 100 'https://ndownloader.figshare.com/files/6929198' -o /tmp/masi-original.osim
          curl -fL --retry 3 --max-time 90 'https://raw.githubusercontent.com/MyoHub/myoconverter/main/models/osim/Neck6D/Geometry/rotatedcerv7.vtp' -o /tmp/masi-c7.vtp
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/fhs-original.zip') as z:
            source='FHS_dataset_4.x - Copia/Male/Age4049/110_SizeScaled_CurvatureAdjust_MuscleAdjust.osim'
            assert source in z.namelist(), 'Expected FHS source specimen absent'
            Path('/tmp/fhs-original.osim').write_bytes(z.read(source))
          PY
          python opensim-lab/convert_masi_legacy.py --source /tmp/masi-original.osim --output /tmp/masi-migrated.osim
      - name: Build diagnostic MASI–FHS rigid registration, NOT biomechanical graft
        run: |
          python opensim-lab/audit_c7_t1_registration.py \
            --masi /tmp/masi-migrated.osim \
            --fhs /tmp/fhs-original.osim \
            --fhs-archive /tmp/fhs-original.zip \
            --masi-c7-vtp /tmp/masi-c7.vtp \
            --output qa-c7-t1/registration.json
      - name: Check registration and prohibit claims of anatomical validation
        run: |
          python - <<'PY'
          import json,math
          d=json.load(open('qa-c7-t1/registration.json'))
          assert len(d['fhsVertebralFrames'])==17
          assert d['registration']['uniformScale']==1
          assert d['registration']['anchorResidualMm']<0.0001
          assert d['registration']['verifiedAnatomicalFit'] is False
          assert d['registration']['verifiedMuscleOrDynamicCompatibility'] is False
          assert d['notAValidatedHybridModel']
          assert all(math.isfinite(x) for row in d['registration']['rotationMatrix'] for x in row)
          assert 0<=d['C7T1Geometry']['minVertexToVertexSeparationMm']<100
          print('REGISTRATION_C7T1_DIAGNOSTIC_QA_OK',json.dumps({
            'minVertexMm':d['C7T1Geometry']['minVertexToVertexSeparationMm'],
            'verticalGapMm':d['C7T1Geometry']['verticalBoundingBoxGapMm'],
            'centerSpacingMm':d['C7T1Geometry']['boundingBoxCenterSpacingMm'],
            'vertebralBodies':len(d['fhsVertebralFrames'])
          }))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masi-fhs-c7-t1-diagnostic-no-mesh
          path: qa-c7-t1/
          retention-days: 30
