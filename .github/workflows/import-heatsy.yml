name: Prepare open anatomical rig
on:
  push:
    paths:
      - '.github/workflows/import-heatsy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify CC BY-SA anatomy assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p anatomy-rigged/assets
          src='https://raw.githubusercontent.com/heatsy-app/heatsy-body-model/6cf6a0ae7c63bcffca1137ddcec14a31b7254a6d'
          curl --fail --location --retry 3 "$src/model/body_superficial.app5m.glb" -o anatomy-rigged/assets/body_superficial.glb
          echo 'ce9859de013c2ee9713dbe3158275208b57be1b4ff31957eca87195b991c0ab1  anatomy-rigged/assets/body_superficial.glb' | sha256sum --check
          for srcfile in data/muscles.json NOTICE.md LICENSE; do
            curl --fail --location --retry 3 "$src/$srcfile" -o "anatomy-rigged/assets/$(basename "$srcfile")"
          done
      - name: Inspect skeleton metadata from verified glTF
        shell: bash
        run: |
          python3 - <<'PY'
          import json,struct,pathlib
          root=pathlib.Path('anatomy-rigged/assets')
          raw=(root/'body_superficial.glb').read_bytes()
          magic,ver,length=struct.unpack_from('<III',raw,0)
          assert (magic,ver,length)==(0x46546c67,2,len(raw))
          n,typ=struct.unpack_from('<I4s',raw,12)
          assert typ==b'JSON'
          gltf=json.loads(raw[20:20+n])
          joints=gltf['skins'][0]['joints']
          nodes=gltf['nodes']
          parents={child:i for i,node in enumerate(nodes) for child in node.get('children',[])}
          data={'generator':gltf.get('asset',{}).get('generator'),'extras':gltf.get('extras'),
              'boneCount':len(joints), 'skinJointIndices':joints,
              'nodes':[{'index':i,'name':nodes[i].get('name',''),'parent':parents.get(i),
              'translation':nodes[i].get('translation'),
              'rotation':nodes[i].get('rotation'),
              'scale':nodes[i].get('scale')} for i in joints],
              'meshNodes':[{'index':i,'name':n.get('name',''),'mesh':n.get('mesh'),'skin':n.get('skin'),'scale':n.get('scale'),'matrix':n.get('matrix'),'translation':n.get('translation'),'rotation':n.get('rotation')} for i,n in enumerate(nodes) if 'mesh' in n],
              'skins':[{'name':s.get('name'),'joints':len(s.get('joints',[])),'skeleton':s.get('skeleton')} for s in gltf['skins']],
              'meshPrimitives':[{'attributes':p.get('attributes'),'positionAccessor':gltf['accessors'][p['attributes']['POSITION']]} for p in gltf['meshes'][0]['primitives']],
              'rootNodes':[{'index':i,'name':n.get('name'),'translation':n.get('translation'),'rotation':n.get('rotation'),'scale':n.get('scale'),'matrix':n.get('matrix')} for i,n in enumerate(nodes) if i not in joints and 'mesh' not in n]}
          (root/'rig-inspect.json').write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          print('Bones:',len(joints),'node names:',[nodes[i].get('name') for i in joints])
          PY
      - name: Inspect bind matrices and skin vertex data
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,json,struct
          root=pathlib.Path('anatomy-rigged/assets')
          raw=(root/'body_superficial.glb').read_bytes()
          jlen=struct.unpack_from('<I',raw,12)[0]
          goff=20+jlen
          bsize,btype=struct.unpack_from('<I4s',raw,goff)
          assert btype==b'BIN\\0'
          binary=raw[goff+8:goff+8+bsize]
          doc=json.loads(raw[20:20+jlen])
          access=doc['accessors'];views=doc['bufferViews']
          comps={5120:('b',1),5121:('B',1),5122:('h',2),5123:('H',2),5125:('I',4),5126:('f',4)}
          counts={'SCALAR':1,'VEC2':2,'VEC3':3,'VEC4':4,'MAT4':16}
          def item(i,k):
            a=access[i];v=views[a['bufferView']]
            char,n=comps[a['componentType']]
            width=counts[a['type']]
            stride=v.get('byteStride',width*n)
            off=v.get('byteOffset',0)+a.get('byteOffset',0)+stride*k
            return struct.unpack_from('<'+char*width,binary,off)
          p=doc['meshes'][0]['primitives'][0]
          attrs=p['attributes']
          pos=access[attrs['POSITION']]
          skin=doc['skins'][0]
          bm=access[skin['inverseBindMatrices']]
          ids=skin['joints']
          matrices=[item(skin['inverseBindMatrices'],i) for i in range(len(ids))]
          md={
            'version':1,'extensionsUsed':doc.get('extensionsUsed'),
            'position':pos,'primitiveAttributes':{k:access[v] for k,v in attrs.items()},
            'sourceScene':doc.get('scene'),'scenes':doc.get('scenes'),
            'root':doc['nodes'][doc['scenes'][0]['nodes'][0]],
            'inverseBindAccessor':bm,
            'bones':[{
              'name':doc['nodes'][n].get('name'),
              'joint':n,
              'ibmTranslation':list(matrices[i][12:15]),
              'ibmDiagonal':[matrices[i][0],matrices[i][5],matrices[i][10],matrices[i][15]],
             } for i,n in enumerate(ids)],
            'vertices':[{
              'index':k,
              'position':list(item(attrs['POSITION'],k)),
              'joints':list(item(attrs['JOINTS_0'],k)) if 'JOINTS_0' in attrs else None,
              'weights':list(item(attrs['WEIGHTS_0'],k)) if 'WEIGHTS_0' in attrs else None,
              } for k in [0,5,150,2000,10000,40000,70000]],
          }
          (root/'rig-diagnostics.json').write_text(json.dumps(md,ensure_ascii=False,indent=2)+'\\n')
          print('Mesh attributes:',list(attrs),'IBM count:',len(matrices))
          PY
      - name: Commit verified open model and skeleton metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anatomy-rigged/assets
          if ! git diff --cached --quiet; then
            git commit -m 'Import verified Heatsy open 56-bone anatomical model (CC BY-SA 4.0)'
            git push
          fi
