name: QA original FHS anatomy and body-frame export
on:
  push:
    paths:
      - 'opensim-lab/export_original_mesh_frames.py'
      - 'opensim-lab/original-anatomy.html'
      - 'opensim-lab/assets/fhs-original-frames.json'
      - '.github/workflows/qa-fhs-mesh-frames.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific OpenSim
        run: python -m pip install 'opensim==4.6'
      - name: Obtain original scientific ZIP for temporary local inspection
        shell: bash
        run: |
          mkdir -p qa-fhs-original
          curl -fL --retry 3 --max-time 180 'https://zenodo.org/records/18259702/files/FHS_dataset_4.x.zip?download=1' -o /tmp/fhs-original.zip
          python - <<'PY'
          import json,zipfile,xml.etree.ElementTree as ET
          from pathlib import Path
          z=zipfile.ZipFile('/tmp/fhs-original.zip')
          models=sorted(n for n in z.namelist() if n.lower().endswith('.osim') and '/male/' in n.lower())
          assert models
          name=models[0]
          Path('/tmp/sample-fhs.osim').write_bytes(z.read(name))
          Path('/tmp/archive-relative-name.txt').write_text(name)
          for fn in ['skull.vtp','thumbprox.vtp','cerv1.vtp','thoracic1_s.vtp','Rib1R.vtp','Rib6L.vtp','Rib12R.vtp','pelvis_rv.vtp']:
            p=next((s for s in z.namelist() if s.endswith('/Geometry/'+fn)),None)
            assert p
            doc=ET.fromstring(z.read(p))
            piece=doc.find('./PolyData/Piece')
            fields={
              'points':[(x.get('Name'),x.get('format'),x.get('NumberOfComponents')) for x in piece.findall('./Points/DataArray')],
              'polys':[(x.get('Name'),x.get('format')) for x in piece.findall('./Polys/DataArray')],
              'pointCount':piece.get('NumberOfPoints'),
              'polygonCount':piece.get('NumberOfPolys'),
            }
            print('FHS_VTP_STRUCTURE',fn,json.dumps(fields))
            print('FHS_VTP_TOPOLOGY',fn,json.dumps({
              'counts':piece.attrib,
              'lines':[(x.get('Name'),x.get('format'),len((x.text or '').split())) for x in piece.findall('./Lines/DataArray')],
              'strips':[(x.get('Name'),x.get('format'),len((x.text or '').split())) for x in piece.findall('./Strips/DataArray')],
              'polys':[(x.get('Name'),x.get('format'),len((x.text or '').split())) for x in piece.findall('./Polys/DataArray')]
            }))
          model_xml=ET.fromstring(z.read(name)).find('Model')
          link_rows=[]
          for joint in model_xml.findall('./JointSet/objects/*'):
            joint_name=joint.get('name','')
            if any(k in joint_name.lower() for k in ('rib','clav','scap','stern','should','thorac','humer')):
              link_rows.append({
                'name':joint_name,'type':joint.tag,
                'parent':joint.findtext('socket_parent_frame'),
                'child':joint.findtext('socket_child_frame'),
                'offsets':[
                  {'name':f.get('name'), 'socket_parent':f.findtext('socket_parent'),
                    'translation':f.findtext('translation'),'orientation':f.findtext('orientation')}
                  for f in joint.findall('./frames/*')
                ]})
          all_links=[]
          for joint in model_xml.findall('./JointSet/objects/*'):
            all_links.append({
              'name':joint.get('name',''), 'type':joint.tag,
              'parent':joint.findtext('socket_parent_frame'), 'child':joint.findtext('socket_child_frame'),
              'frames':[{'name':f.get('name'),'socket':f.findtext('socket_parent'),'translation':f.findtext('translation')}
                        for f in joint.findall('./frames/*')]
            })
          print('FHS_ALL_JOINT_LINKS',json.dumps(all_links))
          print('FHS_SOURCE_CONNECTIONS',json.dumps(link_rows))
          print('FHS_SOURCE_PATH',name)
          PY
      - name: Read native OpenSim transforms with exact body names
        shell: bash
        run: |
          python opensim-lab/export_original_mesh_frames.py \
            --model /tmp/sample-fhs.osim \
            --archive-relative "$(cat /tmp/archive-relative-name.txt)" \
            --output qa-fhs-original/frames-manifest.json
      - name: Assert orthonormal body frames
        shell: bash
        run: |
          python - <<'PY'
          import json,math
          data=json.load(open('qa-fhs-original/frames-manifest.json'))
          assert len(data['bodyFrames'])==68
          assert len(data['anatomyMeshes']['hand_R'])>=25
          for name,frame in data['bodyFrames'].items():
            cols=frame['basisColumns']
            assert all(abs(sum(v*v for v in c)-1)<1e-5 for c in cols),(name,cols)
            assert all(abs(sum(a*b for a,b in zip(cols[i],cols[j])))<1e-5 for i in range(3) for j in range(i+1,3)),name
          print('FHS_ORIGINAL_FRAMES_QA_OK',len(data['bodyFrames']))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless mobile browser
        run: npm install --prefix /tmp/fhs-web-qa --no-audit --no-fund playwright-core@1.56.1
      - name: Read actual ZIP meshes in Chrome and inspect geometry placement
        shell: bash
        run: |
          mkdir -p opensim-lab/assets
          cp qa-fhs-original/frames-manifest.json opensim-lab/assets/fhs-original-frames.json
          python3 -m http.server 8757 --bind 127.0.0.1 >/tmp/fhs-web-qa-serve.log 2>&1 &
          node --input-type=module <<'NODE'
          import {chromium} from '/tmp/fhs-web-qa/node_modules/playwright-core/index.mjs';
          import {writeFileSync} from 'node:fs';
          const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          try{
            await page.goto('http://127.0.0.1:8757/opensim-lab/original-anatomy.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>Boolean(window.__fhsGeometryQA?.manifest()),null,{timeout:90000});
            await page.locator('#inputZip').setInputFiles('/tmp/fhs-original.zip');
            await page.waitForFunction(()=>Boolean(window.__fhsGeometryQA?.ready())||document.querySelector('#status')?.textContent?.startsWith('Ошибка:'),null,{timeout:160000});
            if(!await page.evaluate(()=>Boolean(window.__fhsGeometryQA?.ready())))
              throw Error('Original VTP upload failed: '+await page.locator('#status').innerText());
            const report=await page.evaluate(()=>{
              const api=window.__fhsGeometryQA;
              return {stats:api.stats(),head:api.box('head'),hands:api.box('hands'),
                      spine:api.box('spine'),ribs:api.box('ribs'),pelvis:api.box('pelvis'),
                      sampleNames:api.meshNames().slice(0,15)};
            });
            if(report.stats.head!==9||report.stats.hands!==54||
               report.stats.ribs!==24||report.stats.pelvis!==2||
               report.stats.total!==118||report.stats.triangles<200000||errors.length)
              throw Error('Unexpected original mesh counts: '+JSON.stringify({report,errors}));
            for(const [group,obj] of Object.entries({head:report.head,hands:report.hands,spine:report.spine,ribs:report.ribs,pelvis:report.pelvis})){
              if(obj.size.some(x=>!Number.isFinite(x)||x>4)||obj.size.every(x=>x<.002))
                throw Error('Unreasonable geometry bounds: '+JSON.stringify({group,obj}));
            }
            await page.locator('#sceneCanvas').screenshot({path:'qa-fhs-original/whole.png'});
            console.log('FHS_TORSO_IMAGE '+(await page.locator('#sceneCanvas').screenshot({type:'jpeg',quality:55})).toString('base64'));
            for(const id of ['toggleHand','toggleHead','toggleSpine','toggleShoulder','togglePelvis'])await page.locator('#'+id).click();
            await page.waitForTimeout(300);
            await page.locator('#sceneCanvas').screenshot({path:'qa-fhs-original/ribs-only.png'});
            console.log('FHS_RIBS_ONLY_IMAGE '+(await page.locator('#sceneCanvas').screenshot({type:'jpeg',quality:65})).toString('base64'));
            for(const id of ['toggleHand','toggleHead','toggleSpine','toggleShoulder','togglePelvis'])await page.locator('#'+id).click();
            await page.waitForTimeout(300);

            await page.locator('[data-view="head"]').click();
            await page.waitForTimeout(200);
            await page.locator('#sceneCanvas').screenshot({path:'qa-fhs-original/head.png'});
            console.log('FHS_ORIGINAL_QA '+JSON.stringify({report,errors}));
            console.log('FHS_HEAD_IMAGE '+(await page.locator('#sceneCanvas').screenshot({type:'jpeg',quality:50})).toString('base64'));
            await page.locator('[data-view="right"]').click();
            await page.waitForTimeout(200);
            await page.locator('#sceneCanvas').screenshot({path:'qa-fhs-original/hand.png'});
            console.log('FHS_HAND_IMAGE '+(await page.locator('#sceneCanvas').screenshot({type:'jpeg',quality:50})).toString('base64'));

            // A reload must restore the original scientific archive from IndexedDB
            // without asking the user to re-download or re-select the ZIP.
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__fhsGeometryQA?.ready()||document.querySelector('#status')?.textContent?.includes('не удалось восстановить'),null,{timeout:160000});
            if(!await page.evaluate(()=>Boolean(window.__fhsGeometryQA?.ready())))
              throw Error('IndexedDB restore failed: '+await page.locator('#status').innerText());
            const afterReload=await page.evaluate(()=>window.__fhsGeometryQA.stats());
            if(afterReload.total!==118||afterReload.ribs!==24||afterReload.lineSegments<30000)throw Error('Cache restore incomplete: '+JSON.stringify(afterReload));
            const directLink=await page.locator('#getZip').getAttribute('href');
            if(!directLink.includes('zenodo.org/records/18259702/files/'))throw Error('Native download URL missing');
            console.log('FHS_CACHE_RELOAD_QA '+JSON.stringify({restored:true,total:afterReload.total,ribs:afterReload.ribs,lines:afterReload.lineSegments,directLink}));
            await page.locator('#sceneCanvas').screenshot({path:'qa-fhs-original/reloaded.png'});
            writeFileSync('qa-fhs-original/browser-audit.json',JSON.stringify({report,errors},null,2));
          } catch(err){
            await page.screenshot({path:'qa-fhs-original/failed.png',fullPage:true}).catch(()=>{});
            throw err;
          } finally{await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fhs-original-body-frames-only
          path: qa-fhs-original/
          retention-days: 7
