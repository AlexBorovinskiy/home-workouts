name: Audit L5 S1 anatomical sections
on:
  push:
    paths:
      - 'unified-rig/audit_l5s1_sections.py'
      - '.github/workflows/qa-l5s1.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy trimesh matplotlib
      - name: Restore original neutral pose and FHS geometry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45407502408 -n corrected-native-stance -D /tmp/stance
          for url in 'https://zenodo.org/api/records/18259702/files/FHS_dataset_4.x.zip/content' 'https://zenodo.org/records/18259702/files/FHS_dataset_4.x.zip?download=1'; do
            if curl -fL --retry 1 --retry-all-errors --max-time 160 "$url" -o /tmp/fhs.zip && echo 'd2db8c587afb5d1ee0c8081f84c43f8e  /tmp/fhs.zip' | md5sum -c -; then break; fi
            rm -f /tmp/fhs.zip
          done
          test -s /tmp/fhs.zip
      - name: Compare sagittal and coronal bone sections
        run: python unified-rig/audit_l5s1_sections.py /tmp/fhs.zip /tmp/stance/sequences.json qa-l5s1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l5s1-section-audit
          path: qa-l5s1/
          retention-days: 14
