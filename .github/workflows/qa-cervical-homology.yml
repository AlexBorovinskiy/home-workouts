name: Audit homologous MASI FHS cervical geometry scaling
on:
  push:
    paths:
      - 'opensim-lab/audit_cervical_scale.py'
      - '.github/workflows/qa-cervical-homology.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real OpenSim
        run: python -m pip install 'opensim==4.6'
      - name: Download published MASI and FHS source documents and original mesh assets
        shell: bash
        run: |
          mkdir -p qa-cervical-homology /tmp/masi-geometry
          curl -fL --retry 3 --max-time 180 'https://zenodo.org/records/18259702/files/FHS_dataset_4.x.zip?download=1' -o /tmp/fhs-original.zip
          curl -fL --retry 3 --max-time 120 'https://ndownloader.figshare.com/files/6929198' -o /tmp/masi-original.osim
          for name in cerv1 cerv2 cerv3 cerv4 cerv5 cerv6 rotatedcerv7 skull; do
            curl -fL --retry 3 --max-time 70 \
              "https://raw.githubusercontent.com/MyoHub/myoconverter/main/models/osim/Neck6D/Geometry/$name.vtp" \
              -o "/tmp/masi-geometry/$name.vtp"
          done
          python - <<'PY'
          from pathlib import Path
          import zipfile
          archive='/tmp/fhs-original.zip'
          selected='FHS_dataset_4.x - Copia/Male/Age4049/110_SizeScaled_CurvatureAdjust_MuscleAdjust.osim'
          with zipfile.ZipFile(archive) as z:
            assert selected in z.namelist()
            Path('/tmp/fhs-original.osim').write_bytes(z.read(selected))
          PY
          python opensim-lab/convert_masi_legacy.py \
            --source /tmp/masi-original.osim --output /tmp/masi-migrated.osim
      - name: Recompute original native OpenSim C7-T1 alignment
        run: |
          python opensim-lab/audit_c7_t1_registration.py \
            --masi /tmp/masi-migrated.osim \
            --fhs /tmp/fhs-original.osim \
            --fhs-archive /tmp/fhs-original.zip \
            --masi-c7-vtp /tmp/masi-geometry/rotatedcerv7.vtp \
            --output qa-cervical-homology/registration.json
      - name: Compare raw homologous cervical bones and evaluate strictly diagnostic uniform scales
        run: |
          python opensim-lab/audit_cervical_scale.py \
            --fhs-archive /tmp/fhs-original.zip \
            --fhs-model /tmp/fhs-original.osim \
            --masi-geometry-dir /tmp/masi-geometry \
            --registration qa-cervical-homology/registration.json \
            --output qa-cervical-homology/scale-audit.json
      - name: Scientific consistency gates
        run: |
          python - <<'PY'
          import json
          p='qa-cervical-homology/scale-audit.json'
          d=json.load(open(p))
          assert d['schema']=='MASI-FHS-cervical-source-scale-audit-v1'
          assert len(d['sourceCervicalComparison'])==8
          assert all(r['masiVertices']>100 and r['fhsVertices']>100 for r in d['sourceCervicalComparison'])
          assert all(all(.7<x<1.25 for x in r['fhsSourceScaleXYZ']) for r in d['sourceCervicalComparison'])
          assert len(d['trialRigidJointAnchoredUniformScales'])>=2
          assert d['anatomicalLandmarksExplicitlySegmented'] is False
          assert d['articularFacetsValidated'] is False
          assert d['muscleAttachmentAndKinematicsRevalidatedAfterScaling'] is False
          for trial in d['trialRigidJointAnchoredUniformScales']:
            assert 0<=trial['C7T1NearestVertexMm']<100
          print('SCIENTIFIC_HOMOLOGOUS_SCALE_QA_OK')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MASI-FHS-original-cervical-scale-audit-no-source-meshes
          path: qa-cervical-homology/
          retention-days: 30
