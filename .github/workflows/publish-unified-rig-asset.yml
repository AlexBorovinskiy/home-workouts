name: Publish CC0 unified rig asset for isolated preview only
on:
  push:
    paths:
      - '.github/workflows/publish-unified-rig-asset.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  asset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install unchanged verified model, no application code
        shell: bash
        run: |
          mkdir -p anatomy-rigged/assets
          curl --fail --location --retry 3 --max-time 120 \
            'https://www.innerscene.com/api/library/human-base-mesh-with-editable-53-bone-rig-8e7c8ab1/download' \
            -o anatomy-rigged/assets/unified-makehuman-cc0.glb
          echo "f3cd655e44af0a79786b1b4349c4acf1ae342fe6bd0d5fc714e68470dea1b429  anatomy-rigged/assets/unified-makehuman-cc0.glb" | sha256sum --check
          cat > anatomy-rigged/assets/UNIFIED-MAKEHUMAN-CC0.txt <<'EOF'
          Source: Innerscene / human-base-rigged.glb (MakeHuman/MPFB)
          URL: https://www.innerscene.com/tools/library/3d-parts/human-base-mesh-with-editable-53-bone-rig-8e7c8ab1
          License: CC0
          SHA256: f3cd655e44af0a79786b1b4349c4acf1ae342fe6bd0d5fc714e68470dea1b429
          Role: prototype-only unified body rig; NOT approved exercise technique.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anatomy-rigged/assets/unified-makehuman-cc0.glb anatomy-rigged/assets/UNIFIED-MAKEHUMAN-CC0.txt
          git commit -m "Add verified CC0 continuous-body GLB for isolated preview"
          git push origin HEAD:main
