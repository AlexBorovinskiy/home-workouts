<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unified Rig · диагностика</title><style>body{margin:0;background:#111827;color:#e5e7eb;font:15px system-ui}header,footer{padding:12px}h2{margin:0 0 5px}canvas{width:100%;height:53vh;display:block;touch-action:none;background:#0b1220}button,select{background:#243247;color:white;border:1px solid #526078;border-radius:7px;padding:9px;margin:3px}small{color:#aab7cb}#info{white-space:pre-wrap}</style><header><h2>Unified Human Rig · 0.2</h2><small>Диагностика движений OpenSim. Соединения пока не откалиброваны. Одна координата за раз, только рассчитанные позы.</small><div><button onclick="yaw=0;pitch=0;draw()">Спереди</button><button onclick="yaw=Math.PI/2;pitch=0;draw()">Сбоку</button><button onclick="yaw=.65;pitch=.15;draw()">3/4</button><button onclick="zoom*=1.25;draw()">+</button><button onclick="zoom/=1.25;draw()">−</button></div><select id="filter"><option value="all">Все модули</option><option value="fhs">Туловище</option><option value="masi">Шея</option><option value="right">Правая рука</option><option value="left">Левая рука</option><option value="legs">Ноги</option></select><div><select id="control" style="max-width:95%"><option>Загрузка движений…</option></select><button id="reset">Сброс</button></div><div style="display:flex;align-items:center;gap:8px"><input id="phase" type="range" min="0" max="0" value="0" disabled style="flex:1;min-width:60px"><span id="val">—</span><label><input id="showAxes" type="checkbox" checked> Оси</label></div></header><canvas id="cv"></canvas><footer id="info">Загрузка…</footer><script>
let motion=null,active=null,frameAxes=null;const control=document.querySelector('#control'),phase=document.querySelector('#phase'),val=document.querySelector('#val'),showAxes=document.querySelector('#showAxes');
let yaw=.65,pitch=.15,zoom=1,rows=[],points=[],center=[0,0,0],span=1,selected=null;const cv=document.querySelector('#cv'),ctx=cv.getContext('2d'),filter=document.querySelector('#filter'),info=document.querySelector('#info'),colors={fhs:'#2dd4bf',masi:'#c084fc',right:'#60a5fa',left:'#93c5fd',legs:'#fbbf24'};
function project(p){let x=p[0]-center[0],y=p[1]-center[1],z=p[2]-center[2],h=z*Math.cos(yaw)+x*Math.sin(yaw),d=x*Math.cos(yaw)-z*Math.sin(yaw),v=y*Math.cos(pitch)-d*Math.sin(pitch),s=Math.min(cv.width,cv.height)*.85/span*zoom;return [cv.width/2+h*s,cv.height/2-v*s]}
function draw(){const b=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=b.width*d;cv.height=b.height*d;ctx.clearRect(0,0,cv.width,cv.height);points=[];let byChild=new Map(rows.map(r=>[r.child,r]));for(const r of rows){if(filter.value!=='all'&&r.source!==filter.value)continue;let a=project(r.p),parent=byChild.get(r.parent);ctx.strokeStyle=colors[r.source];ctx.globalAlpha=.65;ctx.lineWidth=1.4*d;if(parent){let q=project(parent.p);ctx.beginPath();ctx.moveTo(...q);ctx.lineTo(...a);ctx.stroke()}ctx.globalAlpha=1;ctx.fillStyle=selected===r?'white':colors[r.source];ctx.beginPath();ctx.arc(...a,(selected===r?6:2.7)*d,0,Math.PI*2);ctx.fill();points.push({r,a})}if(showAxes.checked&&selected&&motion){const i=motion.jointNames.indexOf(selected.joint);const ax=frameAxes||motion.neutralAxes[i];if(ax){const a=project(ax[0]);for(let k=0;k<3;k++){let b=project(ax[0].map((v,j)=>v+.065*ax[k+1][j]));ctx.strokeStyle=['#f87171','#4ade80','#60a5fa'][k];ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=2*d;ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();ctx.font=12*d+'px system-ui';ctx.fillText('XYZ'[k],b[0]+3*d,b[1]);}}}}
let drag=null;cv.onpointerdown=e=>{drag=[e.clientX,e.clientY,e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.012;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*.012));drag[0]=e.clientX;drag[1]=e.clientY;draw()};cv.onpointerup=e=>{if(drag&&Math.hypot(e.clientX-drag[2],e.clientY-drag[3])<5){let b=cv.getBoundingClientRect(),d=devicePixelRatio||1,x=(e.clientX-b.left)*d,y=(e.clientY-b.top)*d;let p=points.reduce((best,q)=>Math.hypot(q.a[0]-x,q.a[1]-y)<(best?Math.hypot(best.a[0]-x,best.a[1]-y):18*d)?q:best,null);if(p){selected=p.r;frameAxes=active&&active.joint===selected.joint?active.samples[+phase.value].axes:null;info.textContent=selected.joint+' · '+selected.source+'\n'+selected.parent+' → '+selected.child+'\nКоординаты: '+selected.coordinates.join(', ')+'\nПоложение дочерней суставной системы, м: '+selected.p.map(x=>x.toFixed(4)).join(', ');draw()}}drag=null};cv.onwheel=e=>{e.preventDefault();zoom*=Math.exp(-e.deltaY*.001);draw()};filter.onchange=()=>{populate();draw()};showAxes.onchange=draw;window.onresize=draw;
const get=async name=>{let r=await fetch(name,{cache:'no-store'});if(!r.ok)throw Error(name+': HTTP '+r.status);return r.json()};
Promise.all([get('topology.json'),get('candidate-report.json')]).then(([t,d])=>{let m=new Map(d.joints.map(j=>[j.name,j]));rows=t.joints.map(j=>({...j,p:m.get(j.joint).child}));for(let i=0;i<3;i++){let v=rows.map(r=>r.p[i]),lo=Math.min(...v),hi=Math.max(...v);center[i]=(lo+hi)/2;span=Math.max(span,hi-lo)}info.textContent=rows.length+' суставов · нажмите на точку для просмотра. Перетаскивание — вращение.';draw();return get('motion.json')}).then(m=>{motion=m;populate();info.textContent='Доступно '+m.controls.length+' координат. Выберите движение. Оси XYZ — локальная родительская система сустава, не обязательно оси вращения.';}).catch(e=>info.textContent='Данные: '+e.message);
function populate(){if(!motion)return;const old=control.value;control.replaceChildren(new Option('Выберите координату',''));for(const q of motion.controls){let r=rows.find(x=>x.joint===q.joint);if(filter.value==='all'||r?.source===filter.value)control.add(new Option(q.name,q.name))}if([...control.options].some(o=>o.value===old))control.value=old;else reset();}
function reset(){active=null;frameAxes=null;phase.disabled=true;phase.value=0;val.textContent='—';if(motion){rows.forEach(r=>r.p=motion.neutralPoints[motion.jointNames.indexOf(r.joint)]);draw()}}document.querySelector('#reset').onclick=()=>{control.value='';reset()};
control.onchange=()=>{active=motion.controls.find(q=>q.name===control.value);if(!active){reset();return}selected=rows.find(r=>r.joint===active.joint);phase.disabled=false;phase.max=active.samples.length-1;phase.value=active.samples.reduce((b,s,i)=>Math.abs(s.value-active.default)<Math.abs(active.samples[b].value-active.default)?i:b,0);apply()};phase.oninput=apply;function apply(){if(!active)return;const s=active.samples[+phase.value];rows.forEach(r=>r.p=s.points[motion.jointNames.indexOf(r.joint)]);selected=rows.find(r=>r.joint===active.joint);frameAxes=s.axes;val.textContent=active.motionType===1?(s.value*180/Math.PI).toFixed(1)+'°':active.motionType===2?(s.value*1000).toFixed(1)+' мм':s.value.toFixed(3);info.textContent=active.name+' · '+active.joint+'\\nПоза '+(+phase.value+1)+'/'+active.samples.length+' · OpenSim\\nНативный диапазон: '+active.range.map(v=>v.toFixed(3)).join(' … ')+'\\nДругие координаты решаются с ограничениями; совмещать движения пока нельзя.';draw()}
</script></html>
