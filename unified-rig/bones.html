<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unified Rig · диагностика</title><style>body{margin:0;background:#111827;color:#e5e7eb;font:15px system-ui}header,footer{padding:12px}h2{margin:0 0 5px}canvas{width:100%;height:51vh;display:block;touch-action:none;background:#0b1220}button,select{background:#243247;color:white;border:1px solid #526078;border-radius:7px;padding:9px;margin:3px}small{color:#aab7cb}#info{white-space:pre-wrap}</style><header><h2>Unified Human Rig · 0.4</h2><small>Контуры из исходных VTP-моделей, привязанные к сегментам OpenSim.</small><div><button onclick="yaw=0;pitch=0;draw()">Спереди</button><button onclick="yaw=Math.PI/2;pitch=0;draw()">Сбоку</button><button onclick="yaw=.65;pitch=.15;draw()">3/4</button><button onclick="zoom*=1.25;draw()">+</button><button onclick="zoom/=1.25;draw()">−</button></div><select id="filter"><option value="all">Все модули</option><option value="fhs">Туловище</option><option value="masi">Шея</option><option value="right">Правая рука</option><option value="left">Левая рука</option><option value="legs">Ноги</option></select><div><select id="sequence" style="max-width:95%"><option>Загрузка движений…</option></select><button id="play" disabled>▶ Старт</button><button id="reset" disabled>Сброс</button></div><div style="display:flex;align-items:center;gap:8px"><input id="phase" type="range" min="0" max="30" value="0" disabled style="flex:1"><span id="counter">—</span></div><label><input type="checkbox" id="landmarks" checked> Ориентиры лопаток и ключиц</label> <label><input type="checkbox" id="bones" checked> Контуры костей</label> <label><input type="checkbox" id="links" checked> Суставная схема</label><div id="meshStatus" style="font-size:12px;color:#b8c5d6">Загрузка контуров…</div></header><canvas id="cv"></canvas><footer id="info">Загрузка…</footer><script>
const meshStatus=document.querySelector('#meshStatus'),bones=document.querySelector('#bones'),links=document.querySelector('#links');let meshes=[];
let data=null,sequence=null,playing=false,start=null,frame=0;const sel=document.querySelector('#sequence'),play=document.querySelector('#play'),phase=document.querySelector('#phase'),counter=document.querySelector('#counter'),landmarks=document.querySelector('#landmarks');
let yaw=.65,pitch=.15,zoom=1,rows=[],points=[],center=[0,0,0],span=1,selected=null;const cv=document.querySelector('#cv'),ctx=cv.getContext('2d'),filter=document.querySelector('#filter'),info=document.querySelector('#info'),colors={fhs:'#2dd4bf',masi:'#c084fc',right:'#60a5fa',left:'#93c5fd',legs:'#fbbf24'};
function project(p){let x=p[0]-center[0],y=p[1]-center[1],z=p[2]-center[2],h=z*Math.cos(yaw)+x*Math.sin(yaw),d=x*Math.cos(yaw)-z*Math.sin(yaw),v=y*Math.cos(pitch)-d*Math.sin(pitch),s=Math.min(cv.width,cv.height)*.85/span*zoom;return [cv.width/2+h*s,cv.height/2-v*s]}
function draw(){const b=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=b.width*d;cv.height=b.height*d;ctx.clearRect(0,0,cv.width,cv.height);points=[];let byChild=new Map(rows.map(r=>[r.child,r]));for(const r of rows){if(filter.value!=='all'&&r.source!==filter.value)continue;let a=project(r.p),parent=byChild.get(r.parent);ctx.strokeStyle=colors[r.source];ctx.globalAlpha=.65;ctx.lineWidth=1.4*d;if(parent&&links.checked){let q=project(parent.p);ctx.beginPath();ctx.moveTo(...q);ctx.lineTo(...a);ctx.stroke()}ctx.globalAlpha=1;ctx.fillStyle=selected===r?'white':colors[r.source];ctx.beginPath();ctx.arc(...a,(selected===r?6:2.7)*d,0,Math.PI*2);if(links.checked)ctx.fill();points.push({r,a})}if(bones.checked&&sequence)drawBones(d);if(landmarks.checked&&sequence){const f=sequence.frames[frame];for(const n of ['RA_scapula','LA_scapula','RA_clavicle','LA_clavicle']){let i=data.bodyNames.indexOf(n);if(i<0)continue;if(filter.value!=='all'&&filter.value!==(n.startsWith('RA')?'right':'left'))continue;const a=project(f.bodies[i]);ctx.strokeStyle='#f8fafc';ctx.fillStyle='#f8fafc';ctx.lineWidth=d;ctx.strokeRect(a[0]-4*d,a[1]-4*d,8*d,8*d);ctx.font=10*d+'px system-ui';ctx.fillText(n.includes('scapula')?'Лопатка':'Ключица',a[0]+7*d,a[1]-5*d)}}}
let drag=null;cv.onpointerdown=e=>{drag=[e.clientX,e.clientY,e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.012;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*.012));drag[0]=e.clientX;drag[1]=e.clientY;draw()};cv.onpointerup=e=>{if(drag&&Math.hypot(e.clientX-drag[2],e.clientY-drag[3])<5){let b=cv.getBoundingClientRect(),d=devicePixelRatio||1,x=(e.clientX-b.left)*d,y=(e.clientY-b.top)*d;let p=points.reduce((best,q)=>Math.hypot(q.a[0]-x,q.a[1]-y)<(best?Math.hypot(best.a[0]-x,best.a[1]-y):18*d)?q:best,null);if(p){selected=p.r;info.textContent=selected.joint+' · '+selected.source+'\n'+selected.parent+' → '+selected.child+'\nКоординаты: '+selected.coordinates.join(', ')+'\nПоложение дочерней суставной системы, м: '+selected.p.map(x=>x.toFixed(4)).join(', ');draw()}}drag=null};cv.onwheel=e=>{e.preventDefault();zoom*=Math.exp(-e.deltaY*.001);draw()};filter.onchange=draw;landmarks.onchange=draw;bones.onchange=draw;links.onchange=draw;window.onresize=draw;
const get=async name=>{const r=await fetch(name,{cache:'no-store'});if(!r.ok)throw Error(name+' HTTP '+r.status);return r.json()};
Promise.all([get('topology.json'),get('candidate-report.json')]).then(([t,d])=>{let m=new Map(d.joints.map(j=>[j.name,j]));rows=t.joints.map(j=>({...j,p:m.get(j.joint).child}));for(let i=0;i<3;i++){let v=rows.map(r=>r.p[i]),lo=Math.min(...v),hi=Math.max(...v);center[i]=(lo+hi)/2;span=Math.max(span,hi-lo)}info.textContent=rows.length+' суставов · нажмите на точку для просмотра. Перетаскивание — вращение.';draw();return get('sequences.json')}).then(d=>{data=d;sel.replaceChildren(...d.sequences.map(s=>new Option(s.label,s.id)));sel.onchange=choose;play.disabled=false;document.querySelector('#reset').disabled=false;phase.disabled=false;choose();loadMeshes()}).catch(e=>info.textContent='Данные: '+e.message);
function choose(){playing=false;play.textContent='▶ Старт';sequence=data.sequences.find(s=>s.id===sel.value);phase.max=sequence.frames.length-1;apply(0)}
function apply(i){frame=i;phase.value=i;let f=sequence.frames[i];rows.forEach(r=>r.p=f.points[data.jointNames.indexOf(r.joint)]);counter.textContent=(i+1)+' / '+sequence.frames.length;info.textContent=sequence.label+' · '+Object.keys(sequence.targets).length+' заданных координат · OpenSim\nБез опоры, баланса и нагрузки. Квадраты — начала систем сегментов; цветные контуры — выпуклые проекции исходных поверхностей.';draw()}
phase.oninput=()=>{playing=false;play.textContent='▶ Старт';apply(+phase.value)};document.querySelector('#reset').onclick=choose;play.onclick=()=>{playing=!playing;play.textContent=playing?'Ⅱ Пауза':'▶ Старт';if(playing){start=null;requestAnimationFrame(tick)}};function tick(t){if(!playing)return;if(start===null)start=t-frame*65;let k=Math.floor((t-start)/65),n=sequence.frames.length-1,i=k%(2*n);apply(i<=n?i:2*n-i);requestAnimationFrame(tick)}

function hull(a){a.sort((p,q)=>p[0]-q[0]||p[1]-q[1]);const cross=(o,p,q)=>(p[0]-o[0])*(q[1]-o[1])-(p[1]-o[1])*(q[0]-o[0]);let l=[],u=[];for(const p of a){while(l.length>=2&&cross(l[l.length-2],l[l.length-1],p)<=0)l.pop();l.push(p)}for(let i=a.length-1;i>=0;i--){const p=a[i];while(u.length>=2&&cross(u[u.length-2],u[u.length-1],p)<=0)u.pop();u.push(p)}return l.slice(0,-1).concat(u.slice(0,-1))}
function drawBones(d){const f=sequence.frames[frame];if(!f.rotations)return;for(const m of meshes){if(filter.value!=='all'&&filter.value!==m.module)continue;const i=data.bodyNames.indexOf(m.body),R=f.rotations[i],p=f.bodies[i];if(!R||!p)continue;let a=hull(m.points.map(v=>project(R.map((row,k)=>p[k]+row.reduce((s,x,j)=>s+x*v[j],0)))));if(a.length<3)continue;ctx.beginPath();ctx.moveTo(...a[0]);for(const q of a.slice(1))ctx.lineTo(...q);ctx.closePath();ctx.strokeStyle=m.color;ctx.fillStyle=m.color;ctx.globalAlpha=.20;ctx.fill();ctx.globalAlpha=.95;ctx.lineWidth=1.6*d;ctx.stroke();ctx.globalAlpha=1;}}
async function loadMeshes(){if(!sequence.frames[0].rotations){meshStatus.textContent='Нужны обновлённые данные с ориентациями сегментов';return}try{const [a,l]=await Promise.all([get('../opensim-lab/assets/aah-hand-poses.json'),get('../opensim-lab/assets/rajagopal-lower-limbs.json')]);let todo=[];for(const side of ['right','left'])for(const m of a[side].displayMeshes){if(!/^(RA|LA)(2U|2R|1H|_scapula|_clavicle)$/.test(m.body))continue;todo.push({...m,module:side,url:'https://raw.githubusercontent.com/nishbo/ms_arm_and_hand/main/AAH%20Model/Geometry/'+encodeURIComponent(m.file),color:m.body.endsWith('2R')?'#fbbf24':m.body.endsWith('2U')?'#67e8f9':'#a5b4fc'})}for(const side of ['r','l'])for(const m of l.bodyMeshes['patella_'+side])todo.push({...m,module:'legs',color:'#fb7185',url:'https://raw.githubusercontent.com/opensim-org/opensim-models/master/Geometry/'+encodeURIComponent(m.file)});const result=await Promise.allSettled(todo.map(async m=>{let r=await fetch(m.url);if(!r.ok)throw Error(m.file+' '+r.status);const doc=new DOMParser().parseFromString(await r.text(),'application/xml');const a=doc.querySelector('Points > DataArray');if(!a||a.getAttribute('format')!=='ascii')throw Error(m.file+' VTP');const v=a.textContent.trim().split(/\s+/).map(Number);if(v.length%3||v.some(x=>!Number.isFinite(x)))throw Error(m.file+' invalid');const points=[];for(let i=0;i<v.length;i+=3)points.push([0,1,2].map(k=>v[i+k]*m.scale[k]));if(points.length<4)throw Error(m.file+' empty');return {...m,points}}));meshes=result.filter(x=>x.status==='fulfilled').map(x=>x.value);meshStatus.textContent='Контуры '+meshes.length+'/'+todo.length+' · жёлтый — лучевая, голубой — локтевая, розовый — надколенник'+(meshes.length<todo.length?' · часть исходников недоступна':'');draw()}catch(e){meshStatus.textContent='Контуры: '+e.message}}
</script></html>
