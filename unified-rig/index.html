<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unified Rig · диагностика</title><style>body{margin:0;background:#111827;color:#e5e7eb;font:15px system-ui}header,footer{padding:12px}h2{margin:0 0 5px}canvas{width:100%;height:65vh;display:block;touch-action:none;background:#0b1220}button,select{background:#243247;color:white;border:1px solid #526078;border-radius:7px;padding:9px;margin:3px}small{color:#aab7cb}#info{white-space:pre-wrap}</style><header><h2>Unified Human Rig · 0.1</h2><small>Исходная поза OpenSim. Соединения не откалиброваны. Линии — топология, не кости.</small><div><button onclick="yaw=0;pitch=0;draw()">Спереди</button><button onclick="yaw=Math.PI/2;pitch=0;draw()">Сбоку</button><button onclick="yaw=.65;pitch=.15;draw()">3/4</button><button onclick="zoom*=1.25;draw()">+</button><button onclick="zoom/=1.25;draw()">−</button></div><select id="filter"><option value="all">Все модули</option><option value="fhs">Туловище</option><option value="masi">Шея</option><option value="right">Правая рука</option><option value="left">Левая рука</option><option value="legs">Ноги</option></select></header><canvas id="cv"></canvas><footer id="info">Загрузка…</footer><script>
let yaw=.65,pitch=.15,zoom=1,rows=[],points=[],center=[0,0,0],span=1,selected=null;const cv=document.querySelector('#cv'),ctx=cv.getContext('2d'),filter=document.querySelector('#filter'),info=document.querySelector('#info'),colors={fhs:'#2dd4bf',masi:'#c084fc',right:'#60a5fa',left:'#93c5fd',legs:'#fbbf24'};
function project(p){let x=p[0]-center[0],y=p[1]-center[1],z=p[2]-center[2],h=z*Math.cos(yaw)+x*Math.sin(yaw),d=x*Math.cos(yaw)-z*Math.sin(yaw),v=y*Math.cos(pitch)-d*Math.sin(pitch),s=Math.min(cv.width,cv.height)*.85/span*zoom;return [cv.width/2+h*s,cv.height/2-v*s]}
function draw(){const b=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=b.width*d;cv.height=b.height*d;ctx.clearRect(0,0,cv.width,cv.height);points=[];let byChild=new Map(rows.map(r=>[r.child,r]));for(const r of rows){if(filter.value!=='all'&&r.source!==filter.value)continue;let a=project(r.p),parent=byChild.get(r.parent);ctx.strokeStyle=colors[r.source];ctx.globalAlpha=.65;ctx.lineWidth=1.4*d;if(parent){let q=project(parent.p);ctx.beginPath();ctx.moveTo(...q);ctx.lineTo(...a);ctx.stroke()}ctx.globalAlpha=1;ctx.fillStyle=selected===r?'white':colors[r.source];ctx.beginPath();ctx.arc(...a,(selected===r?6:2.7)*d,0,Math.PI*2);ctx.fill();points.push({r,a})}}
let drag=null;cv.onpointerdown=e=>{drag=[e.clientX,e.clientY,e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.012;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*.012));drag[0]=e.clientX;drag[1]=e.clientY;draw()};cv.onpointerup=e=>{if(drag&&Math.hypot(e.clientX-drag[2],e.clientY-drag[3])<5){let b=cv.getBoundingClientRect(),d=devicePixelRatio||1,x=(e.clientX-b.left)*d,y=(e.clientY-b.top)*d;let p=points.reduce((best,q)=>Math.hypot(q.a[0]-x,q.a[1]-y)<(best?Math.hypot(best.a[0]-x,best.a[1]-y):18*d)?q:best,null);if(p){selected=p.r;info.textContent=selected.joint+' · '+selected.source+'\n'+selected.parent+' → '+selected.child+'\nКоординаты: '+selected.coordinates.join(', ')+'\nПоложение дочерней суставной системы, м: '+selected.p.map(x=>x.toFixed(4)).join(', ');draw()}}drag=null};cv.onwheel=e=>{e.preventDefault();zoom*=Math.exp(-e.deltaY*.001);draw()};filter.onchange=draw;window.onresize=draw;
Promise.all([fetch('topology.json').then(r=>r.json()),fetch('candidate-report.json').then(r=>r.json())]).then(([t,d])=>{let m=new Map(d.joints.map(j=>[j.name,j]));rows=t.joints.map(j=>({...j,p:m.get(j.joint).child}));for(let i=0;i<3;i++){let v=rows.map(r=>r.p[i]),lo=Math.min(...v),hi=Math.max(...v);center[i]=(lo+hi)/2;span=Math.max(span,hi-lo)}info.textContent=rows.length+' суставов · нажмите на точку для просмотра. Перетаскивание — вращение.';draw()}).catch(e=>info.textContent='Ошибка: '+e.message);
</script></html>
