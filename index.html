/* Inline technique demonstrations: accessible, touch-friendly, loaded only after a tap. */
.tech-video{margin:16px 0 6px;border:1px solid #39516e;background:#0c1729;border-radius:17px;overflow:hidden}
.tech-video-placeholder{min-height:174px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;text-align:center;background:radial-gradient(circle at 65% 25%,#243f5d,#101a2c 68%);gap:10px}
.tech-video-placeholder .play-button{display:flex;align-items:center;justify-content:center;background:#acdff3;color:#0e2134;border-radius:50%;font-size:23px;width:64px;height:64px;border:0;box-shadow:0 8px 26px #0006;padding-left:4px}
.tech-video-placeholder strong{font-size:14px}
.tech-video-placeholder p{font-size:11px;color:#adbed2;max-width:320px;margin:0;line-height:1.5}
.tech-video iframe{width:100%;aspect-ratio:16/9;display:block;border:0;background:#050913}
.tech-video-meta{padding:10px 13px;display:flex;align-items:center;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:11px;color:#c1d0e2}
.tech-video-meta a{color:#b8e6f6;text-decoration:underline;text-underline-offset:2px}
.tech-steps{counter-reset:step;list-style:none!important;padding-left:0!important;display:grid;gap:9px}
.tech-steps li{display:flex;align-items:flex-start;gap:10px;line-height:1.5;margin:0!important;background:#1a2a42;border:1px solid #2b425d;border-radius:12px;padding:12px;color:#e1eefd}
.tech-steps li::before{counter-increment:step;content:counter(step);display:grid;place-items:center;flex:0 0 25px;height:25px;border-radius:8px;background:#a6d9ee;color:#15263e;font-size:12px;font-weight:800}
@media (max-width:390px){.tech-video-placeholder{min-height:155px}}

body.rest-active .app{padding-bottom:calc(290px + env(safe-area-inset-bottom))}
.rest-dock[hidden]{display:none!important}
.rest-dock{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(75px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:728px;padding:13px 15px 12px;background:#203452f5;border:1px solid #83a8c4;border-radius:20px;box-shadow:0 12px 42px #020813b5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.rest-dock .rest-label{font-size:12px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rest-dock .rest-time{font-size:29px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rest-dock .rest-sub{font-size:11px;color:#bbcee0;margin:2px 0 8px;line-height:1.4}
.rest-dock .rest-progress{height:5px;background:#0c192c;border-radius:9px;overflow:hidden;margin-bottom:9px}
.rest-dock .rest-progress span{display:block;height:100%;width:100%;background:#a4dfee;transition:width .35s linear}
.rest-dock .rest-ctrls{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:7px}
.rest-dock .rest-ctrls button{min-width:0;min-height:38px;padding:8px 5px;font-size:12px}
.rest-dock.finished{border-color:#a9d9b9;background:#1e3b40f5}
.rest-mark{display:flex;align-items:center;gap:8px;margin-top:6px}
.rest-mark button{min-height:35px;font-size:11px;flex:1;white-space:normal;text-align:center}
.rest-mark .done-set{color:#b8e3b8;background:#18382d;border:1px solid #47785e}

.rest-explainer{margin-top:11px}
@media(max-width:365px){.rest-dock{padding:10px 11px}.rest-dock .rest-time{font-size:25px}.rest-mark{flex-wrap:wrap}.rest-mark .rest-reco{flex:0 0 100%}}

push:{name:'Отжимания от пола',icon:'↗',muscle:'Грудь · трицепсы · плечи',kind:'повт.',min:6,max:12,tag:'Главное',video:'push up exercise proper form ACE Fitness',page:ACE+'41/push-up/',steps:['Поставь ладони примерно под плечами или немного шире, вытяни ноги и напряги живот.','Опускай грудь между кистями, сохраняя тело одной линией от головы до пяток.','Выжимай себя вверх без провала в пояснице и без резкого распрямления локтей.'],errors:['Таз провисает или резко поднимается.','Локти разведены строго в стороны на 90°.','Движение короткое и рывковое.'],easier:'Отжимания руками от устойчивой возвышенной поверхности.',harder:'Пауза 1 секунду внизу или медленное опускание 3 секунды.'},

const BASE={A:['push','pike','lunge','bridge','snow','deadbug'],B:['close','split','hinge','ytw','side','calf']};
const WITH_DB={A:['push','pike','lunge','bridge','row','lateral','deadbug'],B:['close','split','hinge','row','side','calf']};
const MAIN_IDS=new Set(['push','close','lunge','bridge','split','hinge','row']);
const DB_DEFAULT={schemaVersion:VERSION,prefs:{started:today(),dumbbells:false,weightBaseline:73,planOverrides:null,restMode:'balanced'},sessions:[],measurements:[],lastBackupAt:null};
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function escapeHTML(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function readStore(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):structuredClone(fallback)}catch(e){return structuredClone(fallback)}}
let persistOK=true;try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){persistOK=false}
let db=readStore(STORE,DB_DEFAULT);if(!db||typeof db!=='object'||!Array.isArray(db.sessions)||!Array.isArray(db.measurements)||!db.prefs)db=structuredClone(DB_DEFAULT);
let draft=readStore(DRAFT_STORE,null),tab='today',type='A',editId=null,measureMetric='weight',chartEx='push',techFilter='',openEx=null,restState=null,restTone=null;
function save(){try{localStorage.setItem(STORE,JSON.stringify(db));return true}catch(e){notify('Не удалось сохранить данные. Выгрузи резервную копию.');return false}}
function saveDraft(){try{localStorage.setItem(DRAFT_STORE,JSON.stringify(draft))}catch(e){notify('Не удалось сохранить черновик')}}
function notify(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(notify._t);notify._t=setTimeout(()=>t.classList.remove('show'),3300)}
function dateObj(s){const d=new Date(String(s||'')+'T12:00:00');return Number.isNaN(d.getTime())?new Date():d}
function prettyDate(s){return dateObj(s).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'})}
function week(){const a=dateObj(db.prefs.started),b=dateObj(today());return Math.max(1,Math.floor((b-a)/86400000/7)+1)}
function planned(){return week()<=2?2:3}
function lastSession(){return [...db.sessions].sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)))[0]}
function suggestedType(){const l=lastSession();return l?.type==='A'?'B':'A'}
function ids(t){const custom=db.prefs.planOverrides?.[t];if(Array.isArray(custom)&&custom.length&&custom.every(id=>EX[id]&&(!EX[id].equipment||db.prefs.dumbbells)))return custom;return (db.prefs.dumbbells?WITH_DB:BASE)[t]}
function target(id){const t=db.prefs.planOverrides?.targets?.[id];return t&&Number.isInteger(Number(t.min))&&Number.isInteger(Number(t.max))&&Number(t.min)>0&&Number(t.max)>=Number(t.min)&&Number(t.max)<=400?{min:Number(t.min),max:Number(t.max)}:{min:EX[id].min,max:EX[id].max}}
function setCount(id){const custom=db.prefs.planOverrides?.targets?.[id]?.sets;if(custom!=null&&Number.isInteger(Number(custom))&&Number(custom)>=1&&Number(custom)<=6)return Number(custom);return week()<=2?2:MAIN_IDS.has(id)?3:2}
function defaultSets(id){return Array.from({length:setCount(id)},()=>({reps:'',weight:''}))}
function newDraft(t){return {type:t,date:today(),notes:'',effort:'',minutes:'',entries:Object.fromEntries(ids(t).map(id=>[id,defaultSets(id)]))}}
function initDraft(){if(!draft||!draft.entries||!draft.type||!draft.date){type=suggestedType();draft=newDraft(type);saveDraft()}else type=draft.type;}
initDraft();
/* Перерывы задаются по типу упражнения, а не одной цифрой на всю тренировку.
   Эти значения — стартовые ориентиры, а не медицинская норма. */
const REST_SECONDS={
 balanced:{push:120,pike:120,close:120,lunge:120,split:120,hinge:120,row:120,bridge:90,lateral:90,calf:60,snow:60,ytw:60,deadbug:60,side:60},
 extended:{push:180,pike:180,close:180,lunge:150,split:150,hinge:150,row:180,bridge:120,lateral:120,calf:90,snow:90,ytw:90,deadbug:90,side:90},
 compact:{push:90,pike:90,close:90,lunge:90,split:90,hinge:90,row:90,bridge:75,lateral:75,calf:60,snow:60,ytw:60,deadbug:60,side:60}
};
function restFor(id){return (REST_SECONDS[db.prefs.restMode]||REST_SECONDS.balanced)[id]||90}
function formatRest(ms){const sec=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function restRemaining(){if(!restState)return 0;return Math.max(0,restState.paused?restState.remainingMs:restState.deadlineAt-Date.now())}
function restElapsed(){if(!restState)return 0;const now=Date.now();return Math.max(0,now-restState.startedAt-restState.pauseTotalMs-(restState.paused?now-restState.pauseStartedAt:0))}
function rememberRest(){try{if(restState)localStorage.setItem(REST_STORE,JSON.stringify(restState));else localStorage.removeItem(REST_STORE)}catch(e){}}
function loadRest(){const old=readStore(REST_STORE,null);if(old&&typeof old.id==='string'&&Number.isInteger(old.idx)&&Number.isFinite(old.startedAt)&&Date.now()-old.startedAt<4*3600000&&old.durationMs>0){restState=old;restState.pauseTotalMs=Number(old.pauseTotalMs)||0;restState.remainingMs=Number(old.remainingMs)||0;return}restState=null;rememberRest()}
loadRest();
function finishRest(){if(restState){const s=draft.entries?.[restState.id]?.[restState.idx];if(s&&s.done)s.restAfterSec=Math.min(3600,Math.round(restElapsed()/1000));saveDraft()}restState=null;rememberRest();renderRestDock()}
function startRest(id,idx){
 try{if(!restTone){const AC=window.AudioContext||window.webkitAudioContext;if(AC)restTone=new AC()}restTone?.resume?.()}catch(e){}
 const s=dataSets(id)[idx],reps=Number(s?.reps);
 if(!Number.isFinite(reps)||reps<=0||reps>400){notify('Сначала запиши выполненные повторения или секунды.');return}
 if(restState)finishRest();
 s.done=true;saveDraft();
 const all=ids(type),isLastExercise=id===all[all.length-1],isLastSet=idx===dataSets(id).length-1;
 if(isLastExercise&&isLastSet){view();notify('Последний подход отмечен — отдыхать по таймеру уже не нужно');return}
 const now=Date.now(),sec=restFor(id);
 restState={id,idx,startedAt:now,deadlineAt:now+sec*1000,durationMs:sec*1000,remainingMs:sec*1000,paused:false,pauseStartedAt:null,pauseTotalMs:0,notified:false};
 rememberRest();view();notify(`Отдых ${sec} секунд — можно увеличить на 30 сек`)
}
function restBell(){try{if(navigator.vibrate)navigator.vibrate(120);if(restTone?.state==='running'){const o=restTone.createOscillator(),g=restTone.createGain();o.type='sine';o.frequency.value=760;g.gain.setValueAtTime(.06,restTone.currentTime);g.gain.exponentialRampToValueAtTime(.001,restTone.currentTime+.19);o.connect(g);g.connect(restTone.destination);o.start();o.stop(restTone.currentTime+.2)}}catch(e){}}
function renderRestDock(){
 const el=document.getElementById('rest-dock');if(!el)return;
 if(!restState){el.hidden=true;document.body.classList.remove('rest-active');return}
 el.hidden=false;document.body.classList.add('rest-active');
 const left=restRemaining(),finished=left===0;
 el.classList.toggle('finished',finished);
 document.getElementById('rest-label').textContent='Отдых после: '+(EX[restState.id]?.name||'подхода');
 document.getElementById('rest-time').textContent=restState.paused?'⏸ '+formatRest(left):formatRest(left);
 document.getElementById('rest-sub').textContent=restState.paused?'Таймер на паузе':finished?'Время вышло. Продолжай, когда восстановилось дыхание.':`Рекомендуется ${Math.round(restState.durationMs/1000)} сек. · можно продлить`;
 document.getElementById('rest-fill').style.width=(100*left/restState.durationMs).toFixed(1)+'%';
 const toggle=el.querySelector('[data-rest-control="toggle"]');toggle.textContent=restState.paused?'Продолжить':'Пауза';
 if(finished&&!restState.notified){restState.notified=true;rememberRest();restBell()}
}
function restAction(action){if(!restState)return;
 const now=Date.now();
 if(action==='finish'){finishRest();view();return}
 if(action==='toggle'){if(!restState.paused){restState.remainingMs=restRemaining();restState.paused=true;restState.pauseStartedAt=now}else{restState.pauseTotalMs+=now-restState.pauseStartedAt;restState.deadlineAt=now+restState.remainingMs;restState.paused=false;restState.pauseStartedAt=null}}
 if(action==='add'){restState.durationMs+=30000;if(restState.paused)restState.remainingMs+=30000;else restState.deadlineAt=Math.max(restState.deadlineAt,now)+30000;restState.notified=false}
 rememberRest();renderRestDock();
}
setInterval(renderRestDock,450);
document.addEventListener('visibilitychange',renderRestDock);
document.getElementById('rest-dock').addEventListener('click',e=>{const t=e.target.closest('button[data-rest-control]');if(t)restAction(t.dataset.restControl)});
function dataSets(id){if(!draft.entries[id])draft.entries[id]=defaultSets(id);return draft.entries[id]}
function inputNum(v){if(v===''||v==null)return '';const n=Number(v);return Number.isFinite(n)?n:''}
function countSessionsThisWeek(){const start=dateObj(db.prefs.started),w=week();const from=new Date(start.getTime()+(w-1)*7*86400000),to=new Date(from.getTime()+7*86400000);return db.sessions.filter(s=>{const d=dateObj(s.date);return d>=from&&d<to}).length}
function header(){document.getElementById('week-badge').textContent='НЕДЕЛЯ '+week()}
function view(){header();document.querySelectorAll('.nav button').forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));const main=document.getElementById('main');main.innerHTML=({today:renderToday,history:renderHistory,progress:renderProgress,tech:renderTech,data:renderData})[tab]();renderRestDock();}
function renderToday(){const w=week(),weekly=countSessionsThisWeek(),list=ids(type),last=lastSession();const backupDue=db.sessions.length>0 && (!db.lastBackupAt||Date.now()-new Date(db.lastBackupAt).getTime()>7*86400000);
return `<section class="hero"><div class="eyebrow">ПЕРСОНАЛЬНЫЙ ПЛАН · ${w<=8?'8 НЕДЕЛЬ': 'ПРОДОЛЖЕНИЕ'}</div><h2>Небольшие шаги.<br>Заметный прогресс.</h2><p>Возвращаем форму без гонки за рекордами. Твоя стартовая оценка — около 15 отжиманий подряд.</p><div class="pills"><span class="pill">Неделя ${w}</span><span class="pill">${planned()} тренировки в неделю</span><span class="pill">${db.prefs.dumbbells?'С гантелями':'Без оборудования'}</span></div></section>
<div class="grid-stats"><div class="stat"><div class="lab">На этой неделе</div><div class="num count">${weekly}/${planned()}</div></div><div class="stat"><div class="lab">Всего тренировок</div><div class="num count">${db.sessions.length}</div></div><div class="stat"><div class="lab">Последняя</div><div class="num" style="font-size:${last?'17':'23'}px">${last?escapeHTML(last.type)+' · '+dateObj(last.date).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}):'—'}</div></div></div>
${!persistOK?'<div class="notice">⚠ Браузер не разрешает локальное хранение. Не закрывай страницу до выгрузки файлов; для постоянного использования открой сайт через HTTPS.</div>':''}

 : v?`<div class="tech-video" id="tech-video"><div class="tech-video-placeholder" id="tech-video-slot"><button type="button" class="play-button" data-play-tech="${id}" aria-label="Смотреть видео техники: ${escapeHTML(e.name)}">▶</button><strong>Смотреть правильную технику</strong><p>Видеодемонстрация откроется здесь, не покидая журнал. Для загрузки нужен интернет.</p></div><div class="tech-video-meta"><span>${escapeHTML(v.credit)}</span><a href="${externalLink}" target="_blank" rel="noopener noreferrer">Открыть отдельно ↗</a></div></div>`:'<div class="notice">Для этого упражнения пока нет проверенного видеоролика. Ниже — пошаговая техника.</div>';
 document.getElementById('modal').innerHTML=`<button type="button" class="close" id="modal-close" aria-label="Закрыть">×</button><div class="eyebrow">ТЕХНИКА УПРАЖНЕНИЯ</div><h2 id="modal-title">${escapeHTML(e.name)}</h2><div class="chiprow"><span class="chip">${escapeHTML(e.muscle)}</span><span class="chip">${target(id).min}–${target(id).max} ${escapeHTML(e.kind)}</span></div>${videoHTML}<div class="section-head"><h2>Как выполнять</h2></div><ol class="tech-steps">${e.steps.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ol><div class="section-head"><h2>Частые ошибки</h2></div><ul style="font-size:13px;line-height:1.6;color:#d8e5f3;padding-left:21px">${e.errors.map(x=>`<li style="margin:7px 0">${escapeHTML(x)}</li>`).join('')}</ul><div class="muted-box"><div class="small"><strong>Проще:</strong> ${escapeHTML(e.easier)}</div><div class="small" style="margin-top:8px"><strong>Сложнее:</strong> ${escapeHTML(e.harder)}</div></div><div class="footer-note">Сначала изучи положение тела и выполни несколько медленных пробных повторений. При боли прекрати упражнение; если есть ограничения здоровья, согласуй нагрузку со специалистом.</div>`;
 const o=document.getElementById('overlay');o.classList.add('open');o.setAttribute('aria-hidden','false');document.getElementById('modal').scrollTop=0;document.getElementById('modal-close').focus();
}
function playTechniqueVideo(id){
 if(openEx!==id)return;
 const video=TECH_VIDEOS[id],slot=document.getElementById('tech-video-slot');if(!video||!slot)return;
 const iframe=document.createElement('iframe');
 iframe.setAttribute('title','Видео: '+EX[id].name);
 iframe.setAttribute('allow','accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share');
 iframe.setAttribute('allowfullscreen','');
 iframe.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
 iframe.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(video.id)+'?playsinline=1&rel=0';
 slot.replaceWith(iframe);
}
function hideTech(){openEx=null;const o=document.getElementById('overlay');o.classList.remove('open');o.setAttribute('aria-hidden','true');document.getElementById('modal').innerHTML=''}
function saveSession(){if(restState)finishRest();const entries=[];for(const id of ids(type)){const sets=(draft.entries[id]||[]).filter(s=>s.reps!==''&&s.reps!==null&&Number(s.reps)>0).map(s=>({reps:Number(s.reps),weight:EX[id].equipment?Number(s.weight)||0:0,...(s.restAfterSec!=null?{restAfterSec:Number(s.restAfterSec)||0}:{})}));if(sets.length)entries.push({id,sets})}if(!entries.length){notify('Запиши хотя бы один выполненный подход.');return}if(!/^\d{4}-\d\d-\d\d$/.test(draft.date)){notify('Проверь дату тренировки.');return}const s={id:editId||('s_'+Date.now()+'_'+Math.random().toString(36).slice(2,9)),date:draft.date,type,entries,effort:draft.effort?Number(draft.effort):null,minutes:draft.minutes?Number(draft.minutes):null,notes:String(draft.notes||'').slice(0,2000),savedAt:new Date().toISOString()};if(editId)db.sessions=db.sessions.filter(x=>x.id!==editId);db.sessions.push(s);save();editId=null;type=suggestedType();draft=newDraft(type);saveDraft();tab='history';view();window.scrollTo(0,0);notify('Тренировка сохранена ✓')}
function saveMeasure(){const o={id:'m_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),date:document.getElementById('measure-date').value};let atLeastOne=false;for(const key of ['weight','chest','waist','arm']){const raw=document.getElementById('m-'+key).value;const num=raw===''?'':Number(raw);if(raw!==''&&(!Number.isFinite(num)||num<=0||num>300)){notify('Проверь значения замеров.');return}o[key]=num;if(num!=='')atLeastOne=true}if(!atLeastOne){notify('Заполни хотя бы один показатель.');return}if(!/^\d{4}-\d\d-\d\d$/.test(o.date)){notify('Проверь дату.');return}db.measurements.push(o);save();view();notify('Замеры записаны ✓')}
function download(name,content,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function exportJSON(){db.lastBackupAt=new Date().toISOString();save();const pack={application:'Мои тренировки',exportedAt:new Date().toISOString(),...db};download('moi-trenirovki-'+today()+'.json',JSON.stringify(pack,null,2),'application/json;charset=utf-8');notify('Резервная копия сформирована');if(tab==='data')view()}
async function shareJSON(){const payload={application:'Мои тренировки',exportedAt:new Date().toISOString(),...db};const file=new File([JSON.stringify(payload,null,2)],'moi-trenirovki-'+today()+'.json',{type:'application/json'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Мои тренировки — журнал'});db.lastBackupAt=new Date().toISOString();save();if(tab==='data')view();notify('Журнал передан в меню «Поделиться»')}else{exportJSON();notify('Файл JSON скачан — приложи его к чату')}}catch(e){if(e.name!=='AbortError')notify('Не удалось поделиться: сохрани JSON через кнопку рядом')}}
function cellCSV(s){const str=String(s??'');return '"'+str.replace(/"/g,'""')+'"'}
function exportCSV(){const rows=[['Дата','Тренировка','Упражнение','Подход','Повторения_или_секунды','Вес_одной_гантели_кг','Единица','Отдых_после_подхода_сек','Сложность_1_10','Длительность_мин','Заметки']];for(const s of [...db.sessions].sort((a,b)=>a.date.localeCompare(b.date)))for(const v of s.entries||[])for(const [i,z] of (v.sets||[]).entries())rows.push([s.date,s.type,EX[v.id]?.name||v.id,i+1,z.reps,z.weight||'',EX[v.id]?.kind||'повт.',z.restAfterSec??'',s.effort??'',s.minutes??'',s.notes||'']);download('moi-trenirovki-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(cellCSV).join(';')).join('\r\n'),'text/csv;charset=utf-8');notify('CSV сформирован')}
function validImport(d){if(!d||typeof d!=='object'||!Array.isArray(d.sessions)||!Array.isArray(d.measurements)||!d.prefs||typeof d.prefs!=='object')throw new Error('Это не резервная копия журнала.');if(Number(d.schemaVersion)!==VERSION)throw new Error('Версия резервной копии не поддерживается.');if(d.prefs.planOverrides){const p=d.prefs.planOverrides;for(const t of ['A','B'])if(p[t]!=null&&(!Array.isArray(p[t])||!p[t].length||p[t].length>20||p[t].some(id=>!EX[id])))throw new Error('Некорректный индивидуальный план.')}if(d.sessions.length>10000||d.measurements.length>10000)throw new Error('Слишком большой файл.');for(const s of d.sessions){if(typeof s.id!=='string'||typeof s.date!=='string'||!Array.isArray(s.entries)||!['A','B'].includes(s.type))throw new Error('Файл содержит повреждённую тренировку.');for(const e of s.entries){if(typeof e.id!=='string'||!Array.isArray(e.sets)||e.sets.length>30)throw new Error('Повреждены подходы упражнения.');for(const v of e.sets)if(!Number.isFinite(Number(v.reps))||Number(v.reps)<0||Number(v.reps)>400||Number(v.weight||0)>200||(v.restAfterSec!=null&&(!Number.isFinite(Number(v.restAfterSec))||Number(v.restAfterSec)<0||Number(v.restAfterSec)>3600)))throw new Error('Некорректные числа в подходах.')}}for(const m of d.measurements){if(typeof m.id!=='string'||typeof m.date!=='string')throw new Error('Некорректные замеры.')}}
async function importJSON(file){if(!file)return;if(file.size>10*1024*1024){notify('Файл слишком большой (более 10 МБ).');return}try{const parsed=JSON.parse(await file.text());validImport(parsed);const how=document.getElementById('import-mode')?.value||'merge';if(how==='replace'){if(!confirm('Полностью заменить текущую историю загруженным файлом? Сначала желательно сохранить резервную копию.'))return;db={schemaVersion:VERSION,prefs:{...db.prefs,...parsed.prefs},sessions:parsed.sessions,measurements:parsed.measurements,lastBackupAt:parsed.lastBackupAt||null}}else{const s=new Map(db.sessions.map(v=>[v.id,v]));parsed.sessions.forEach(v=>s.set(v.id,v));const m=new Map(db.measurements.map(v=>[v.id,v]));parsed.measurements.forEach(v=>m.set(v.id,v));db.sessions=[...s.values()];db.measurements=[...m.values()];if(parsed.prefs.planOverrides)db.prefs.planOverrides=parsed.prefs.planOverrides}if(!save())return;editId=null;type=suggestedType();draft=newDraft(type);saveDraft();view();notify(`Загружено: ${parsed.sessions.length} тренировок, ${parsed.measurements.length} замеров`)}catch(e){alert('Не удалось импортировать файл: '+e.message)}finally{document.getElementById('import-file').value=''}}
function onAction(action,el){if(action==='mark-set')return startRest(el.dataset.id,Number(el.dataset.idx));if(action==='save-session')return saveSession();if(action==='save-measure')return saveMeasure();if(action==='reset-draft'){if(!confirm('Очистить черновик тренировки?'))return;finishRest();editId=null;draft=newDraft(type);saveDraft();view();return}if(action==='add-set'||action==='remove-set'){const id=el.dataset.id,set=dataSets(id);if(action==='add-set'){if(set.length>=12)return notify('Максимум 12 подходов.');set.push({reps:'',weight:''})}else if(set.length>1){if(restState?.id===id&&restState.idx===set.length-1)finishRest();set.pop()}saveDraft();view();return}if(action==='share')return shareJSON();if(action==='json')return exportJSON();if(action==='csv')return exportCSV();if(action==='import')return document.getElementById('import-file').click();if(action==='save-settings'){const newStart=document.getElementById('started').value;const newDb=document.getElementById('dumbbells').checked;const restMode=document.getElementById('rest-mode').value;if(!/^\d{4}-\d\d-\d\d$/.test(newStart))return notify('Проверь дату начала.');db.prefs.started=newStart;db.prefs.dumbbells=newDb;db.prefs.restMode=REST_SECONDS[restMode]?restMode:'balanced';save();editId=null;type=suggestedType();draft=newDraft(type);saveDraft();view();return notify('Настройки сохранены') }}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;window.scrollTo(0,0);view()});
document.getElementById('main').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.tech)return showTech(t.dataset.tech);if(t.dataset.workout){const next=t.dataset.workout;if(next!==type){finishRest();if(editId&&next!==type){notify('Сначала сохрани или очисти редактируемую запись.');return}type=next;draft=newDraft(type);saveDraft();view()}return}if(t.dataset.action)return onAction(t.dataset.action,t);if(t.dataset.edit){const s=db.sessions.find(x=>x.id===t.dataset.edit);if(!s)return;finishRest();editId=s.id;type=s.type;draft={type:s.type,date:s.date,notes:s.notes||'',effort:s.effort??'',minutes:s.minutes??'',entries:Object.fromEntries(s.entries.map(v=>[v.id,v.sets.map(z=>({reps:z.reps,weight:z.weight||'',restAfterSec:z.restAfterSec??null,done:true}))]))};for(const id of ids(type))if(!draft.entries[id])draft.entries[id]=defaultSets(id);saveDraft();tab='today';view();window.scrollTo(0,0);notify('Редактирование открыто');return}if(t.dataset.delete){if(!confirm('Удалить эту тренировку?'))return;db.sessions=db.sessions.filter(x=>x.id!==t.dataset.delete);save();view();notify('Тренировка удалена');return}if(t.dataset.deleteMeasure){if(!confirm('Удалить эти замеры?'))return;db.measurements=db.measurements.filter(x=>x.id!==t.dataset.deleteMeasure);save();view();notify('Замер удалён')}});
document.getElementById('main').addEventListener('input',e=>{const t=e.target;if(t.dataset.ex){const id=t.dataset.ex,i=Number(t.dataset.idx),key=t.dataset.key;const value=t.value;if(value!==''&&(Number(value)<0||Number(value)>400))return;dataSets(id)[i][key]=value;if(key==='reps'&&dataSets(id)[i].done&&(!Number(value)||Number(value)<0))dataSets(id)[i].done=false;saveDraft();return}if(t.dataset.rootfield){draft[t.dataset.rootfield]=t.value;saveDraft()} });
document.getElementById('main').addEventListener('change',e=>{const t=e.target;if(t.dataset.rootfield){draft[t.dataset.rootfield]=t.value;saveDraft()}if(t.id==='ex-chart'){chartEx=t.value;view()}if(t.id==='measure-chart'){measureMetric=t.value;view()}if(t.id==='tech-search'){techFilter=t.value;view()}});
document.getElementById('main').addEventListener('input',e=>{if(e.target.id==='tech-search'){techFilter=e.target.value;const pos=e.target.selectionStart;view();const inp=document.getElementById('tech-search');inp?.focus();try{inp.setSelectionRange(pos,pos)}catch(e){}}});
document.getElementById('import-file').addEventListener('change',e=>importJSON(e.target.files?.[0]));
document.getElementById('overlay').addEventListener('click',e=>{const play=e.target.closest('button[data-play-tech]');if(play){playTechniqueVideo(play.dataset.playTech);return}if(e.target.id==='overlay'||e.target.id==='modal-close')hideTech()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTech()});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
view();
</script>
